name: aigateway

services:
  gateway:
    image: ${GATEWAY_IMAGE:-aigateway-gateway:local}
    pull_policy: ${AIGATEWAY_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: aigateway-api/Dockerfile
      target: ${GATEWAY_IMAGE_TARGET:-gateway-runtime}
      cache_from:
        - ${GATEWAY_BUILD_CACHE_FROM:-type=registry,ref=ghcr.io/dongwanyang/aigateway-gateway:latest-lite}
      cache_to:
        - type=inline
    ports:
      - "${AIGATEWAY_API_BIND:-127.0.0.1}:${AIGATEWAY_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AI_GATEWAY_REDIS_URL: redis://redis:6379/0
      AI_GATEWAY_QDRANT_URL: http://qdrant:6333
      AI_GATEWAY_CONFIG_PATH: /app/config.yaml
      AI_GATEWAY_EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      AI_GATEWAY_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      AI_GATEWAY_CUDA_MEMORY_FRACTION: ${GATEWAY_CUDA_MEMORY_FRACTION:-}
      # Do not consume a persisted physical GPU UUID here. CUDA deployments
      # either receive logical indices from the generated topology override or
      # see every GPU exposed by the NVIDIA container runtime.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    volumes:
      - ${AIGATEWAY_RUNTIME_CONFIG:-./config.yaml}:/app/config.yaml
      - ${AIGATEWAY_MODEL_DIR:-./models}:/models:ro
      - code_graphs_data:/data/code_graphs
      - ./data:/app/data
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/models:/comfyui/models:ro
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/output:/comfyui/output
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/workflows:/comfyui/workflows:ro
      - ${AIGATEWAY_WORKSPACE:-.}:/workspace:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gateway-net

  control-panel:
    image: ${CONTROL_PANEL_IMAGE:-aigateway-control-panel:local}
    pull_policy: ${AIGATEWAY_PULL_POLICY:-build}
    build:
      context: ./control-panel
      dockerfile: ../Dockerfile.frontend
      args:
        VITE_API_BASE: /aigateway
      cache_from:
        - ${CONTROL_PANEL_BUILD_CACHE_FROM:-type=registry,ref=ghcr.io/dongwanyang/aigateway-control-panel:latest}
      cache_to:
        - type=inline
    ports:
      - "${AIGATEWAY_UI_BIND:-127.0.0.1}:${AIGATEWAY_UI_PORT:-3000}:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - gateway-net

  redis:
    image: redis/redis-stack:7.2.0-v18
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    volumes:
      - redis-data:/data
    command: redis-stack-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - gateway-net

  qdrant:
    profiles: ["knowledge"]
    image: qdrant/qdrant:v1.13.4
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - gateway-net

  comfyui:
    profiles: ["comfy-container"]
    image: ${COMFYUI_IMAGE:-aigateway-comfyui:local}
    pull_policy: ${AIGATEWAY_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: aigateway-api/Dockerfile
      target: comfyui
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:-v0.28.0}
        COMFYUI_MANAGER_VERSION: ${COMFYUI_MANAGER_VERSION:-4.2.1}
      cache_from:
        - ${COMFYUI_BUILD_CACHE_FROM:-type=registry,ref=ghcr.io/dongwanyang/aigateway-comfyui:latest-cuda}
      cache_to:
        - type=inline
    gpus: ${COMFYUI_GPUS:-all}
    ports:
      # ComfyUI does not use Gateway authentication; keep the UI loopback-only.
      - "${COMFYUI_HOST_BIND:-127.0.0.1}:${COMFYUI_HOST_PORT:-8188}:8188"
    environment:
      CUDA_VISIBLE_DEVICES: ${COMFYUI_CUDA_VISIBLE_DEVICES:-0}
      COMFYUI_VRAM_FLAG: ${COMFYUI_VRAM_FLAG:-}
      # Dynamic VRAM can falsely OOM on T4/cudaMallocAsync with nearly all VRAM free.
      COMFYUI_DISABLE_DYNAMIC_VRAM: ${COMFYUI_DISABLE_DYNAMIC_VRAM:-true}
      # CORS for the control-panel "打开 ComfyUI" link (cross-port = cross-site).
      # Default "*" is safe because the port above is loopback-only. Set
      # COMFYUI_CORS_ORIGIN=http://host:3000 if you expose ComfyUI beyond loopback.
      COMFYUI_CORS_ENABLED: ${COMFYUI_CORS_ENABLED:-true}
      COMFYUI_CORS_ORIGIN: ${COMFYUI_CORS_ORIGIN:-}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    volumes:
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/models:/opt/ComfyUI/models
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/custom_nodes:/opt/ComfyUI/custom_nodes
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/input:/opt/ComfyUI/input
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/output:/opt/ComfyUI/output
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/user:/opt/ComfyUI/user
      - ${AIGATEWAY_COMFY_DATA_DIR:-./comfyui}/workflows:/opt/ComfyUI/user/default/workflows:ro
    restart: unless-stopped
    networks:
      - gateway-net

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.3.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped
    networks:
      - gateway-net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.5.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Installer writes a random value whenever monitoring is enabled. A
      # harmless inactive-profile default keeps Lite/Knowledge/Studio config
      # validation from requiring a Grafana-only setting.
      # GRAFANA_ADMIN_PASSWORD must be set by the installer before monitoring starts.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-monitoring-profile-disabled}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  redis-data:
  qdrant-data:
  code_graphs_data:
  prometheus-data:
  grafana-data: