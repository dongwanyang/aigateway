name: aigateway

services:
  gateway:
    build:
      context: .
      dockerfile: aigateway-api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AI_GATEWAY_REDIS_URL=redis://redis:6379/0
      - AI_GATEWAY_QDRANT_URL=http://qdrant:6333
    volumes:
      - ./config.yaml:/app/config.yaml
      - code_graphs_data:/data/code_graphs
      - ./data:/app/data
      - .:/workspace:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gateway-net

  control-panel:
    build:
      context: ./control-panel
      dockerfile: ../Dockerfile.frontend
      args:
        VITE_API_BASE: /aigateway
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - gateway-net

  redis:
    image: redis/redis-stack:7.2.0-v18
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-stack-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - gateway-net

  qdrant:
    image: qdrant/qdrant:v1.13.4
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - gateway-net

  prometheus:
    image: prom/prometheus:v3.1.0
    expose:
      - "9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    networks:
      - gateway-net

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  redis-data:
  qdrant-data:
  grafana-data:
  prometheus-data:
  code_graphs_data:
