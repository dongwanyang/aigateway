name: Apply PR26 Terminal Topology Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-report-2026-08-02
          fetch-depth: 0
      - name: Apply terminal and topology fixes
        run: python scripts/apply_pr26_terminal_and_topology_fix.py
      - name: Commit source and regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aigateway-api/src/aigateway_api/dispatcher.py \
            aigateway-api/src/aigateway_api/gpu_routes.py \
            aigateway-core/src/aigateway_core/pipelines/generation/registration.py \
            aigateway-core/src/aigateway_core/route/streaming/sse.py \
            config.yaml config.yaml.template \
            scripts/quickstart.sh scripts/render-deployment-config.py \
            tests/unit/test_gpu_resource_policy.py \
            tests/unit/test_merge_readiness_followup.py
          git commit -m "fix: finalize streams before terminal events and mark local GPU workers"
          git push origin HEAD:agent/fix-qa-report-2026-08-02
