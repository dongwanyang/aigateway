name: Apply QA review fixes

on:
  push:
    branches:
      - agent/fix-qa-review-findings
    paths:
      - scripts/apply_qa_review_fixes.py
      - .github/workflows/apply-qa-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-review-findings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed changes
        run: python scripts/apply_qa_review_fixes.py
      - name: Remove one-shot tooling
        run: rm -f scripts/apply_qa_review_fixes.py .github/workflows/apply-qa-review-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: address QA review findings"
          git push origin HEAD:agent/fix-qa-review-findings
