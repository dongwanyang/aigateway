name: Apply PR26 Contract Fixes

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-report-2026-08-02
          fetch-depth: 0
      - name: Apply contract alignment
        run: python scripts/apply_pr26_contract_test_fixes.py
      - name: Commit aligned sources and tests
        run: |
          if git diff --quiet; then
            echo "Contracts already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aigateway-api/src/aigateway_api/gpu_routes.py \
            tests/unit/bridge/test_model_router_strategy.py \
            tests/unit/streaming/test_streaming.py \
            tests/unit/test_qa_report_2026_08_02_regressions.py
          git commit -m "test: align legacy contracts with merge fixes"
          git push origin HEAD:agent/fix-qa-report-2026-08-02
