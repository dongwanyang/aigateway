name: Patch dispatcher unpriced cost guard

on:
  push:
    branches:
      - fix/config-hardcode-migration
    paths:
      - .github/workflows/patch-dispatcher-unpriced-cost.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/config-hardcode-migration
          fetch-depth: 0

      - name: Apply focused dispatcher guard and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dispatcher_path = Path(
              "aigateway-core/src/aigateway_core/dispatch/dispatcher.py"
          )
          source = dispatcher_path.read_text(encoding="utf-8")

          old_nonstream = (
              "        final_cost = cost if cost > 0 else "
              "_estimate_cost(logged_model, tt)\n"
          )
          new_nonstream = (
              "        resolved_cost = cost if cost > 0 else "
              "_estimate_cost(logged_model, tt)\n"
              "        final_cost = (\n"
              "            resolved_cost if resolved_cost is not None else 0.0\n"
              "        )\n"
          )
          if source.count(old_nonstream) != 1:
              raise SystemExit(
                  f"expected one non-stream cost site, found "
                  f"{source.count(old_nonstream)}"
              )
          source = source.replace(old_nonstream, new_nonstream, 1)

          old_stream = """        final_cost = (
              _stream_bridge_cost
              if _stream_bridge_cost > 0
              else _estimate_cost(logged_model, tt)
          )
          """
          new_stream = """        resolved_cost = (
              _stream_bridge_cost
              if _stream_bridge_cost > 0
              else _estimate_cost(logged_model, tt)
          )
          final_cost = resolved_cost if resolved_cost is not None else 0.0
          """
          if source.count(old_stream) != 1:
              raise SystemExit(
                  f"expected one stream cost site, found {source.count(old_stream)}"
              )
          source = source.replace(old_stream, new_stream, 1)
          dispatcher_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/unit/dispatch/test_dispatcher_regressions.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "test_nonstream_unpriced_cost_is_safe_for_numeric_sinks"
          if marker not in tests:
              tests += r'''


          @pytest.mark.asyncio
          async def test_nonstream_unpriced_cost_is_safe_for_numeric_sinks():
              key_store = MagicMock()
              key_store.increment_usage = AsyncMock()
              key_store.record_request_cost = AsyncMock()
              bridge = MagicMock()
              bridge.completion = AsyncMock(return_value={
                  "data": {
                      "model": "unpriced-model",
                      "choices": [
                          {"message": {"role": "assistant", "content": "ok"}}
                      ],
                      "usage": {
                          "prompt_tokens": 3,
                          "completion_tokens": 2,
                          "total_tokens": 5,
                      },
                  },
                  "usage": {
                      "prompt_tokens": 3,
                      "completion_tokens": 2,
                      "total_tokens": 5,
                  },
                  "_meta": {
                      "cost": 0.0,
                      "routed_to": {
                          "provider": "test-provider",
                          "model": "unpriced-model",
                      },
                  },
              })
              dispatcher = RequestDispatcher({"key_store": key_store})
              request = SimpleNamespace(
                  state=SimpleNamespace(trace_id="trace-unpriced", request_id="req-unpriced")
              )
              body = SimpleNamespace(
                  messages=[{"role": "user", "content": "hello"}],
                  model="auto",
                  temperature=1.0,
                  max_tokens=None,
                  top_p=1.0,
                  frequency_penalty=0.0,
                  presence_penalty=0.0,
                  tools=None,
                  tool_choice=None,
                  stop=None,
              )

              with (
                  patch(
                      "aigateway_api.openai_compat._record_request_log",
                      new=AsyncMock(),
                  ),
                  patch(
                      "aigateway_core.route.metrics.costing._estimate_cost",
                      return_value=None,
                  ),
              ):
                  response = await dispatcher._call_llm_nonstream(
                      body,
                      request,
                      bridge,
                      plugin_trace=[],
                      request_start_time=time.time(),
                      user_id="user-1",
                      key_hash="key-hash",
                      cache_key=None,
                      normalized_messages=None,
                      pipeline_kind="understanding",
                      group_id="group-1",
                  )

              assert response.status_code == 200
              key_store.record_request_cost.assert_awaited_once()
              assert key_store.record_request_cost.await_args.kwargs["cost_usd"] == 0.0
              key_store.increment_usage.assert_awaited_once()
              assert key_store.increment_usage.await_args.kwargs["cost"] == 0.0


          async def _unpriced_stream_chunks():
              yield {
                  "id": "chatcmpl-unpriced",
                  "model": "unpriced-model",
                  "choices": [
                      {
                          "index": 0,
                          "delta": {"role": "assistant", "content": "ok"},
                          "finish_reason": "stop",
                      }
                  ],
                  "usage": {
                      "prompt_tokens": 3,
                      "completion_tokens": 2,
                      "total_tokens": 5,
                  },
                  "_meta": {
                      "cost": 0.0,
                      "routed_to": {
                          "provider": "test-provider",
                          "model": "unpriced-model",
                      },
                  },
              }


          @pytest.mark.asyncio
          async def test_stream_unpriced_cost_is_safe_for_numeric_sinks():
              key_store = MagicMock()
              key_store.increment_usage = AsyncMock()
              key_store.record_request_cost = AsyncMock()
              dispatcher = RequestDispatcher({})
              request = SimpleNamespace(
                  state=SimpleNamespace(trace_id="trace-stream-unpriced", request_id="req-stream-unpriced")
              )

              with (
                  patch(
                      "aigateway_api.openai_compat._record_request_log",
                      new=AsyncMock(),
                  ),
                  patch(
                      "aigateway_core.route.metrics.costing._estimate_cost",
                      return_value=None,
                  ),
              ):
                  chunks = [
                      chunk
                      async for chunk in dispatcher._wrap_stream_full(
                          _unpriced_stream_chunks(),
                          metrics_collector=None,
                          cache_manager=None,
                          key_store=key_store,
                          request=request,
                          model="auto",
                          user_id="user-1",
                          key_hash="key-hash",
                          cache_key=None,
                          normalized_messages=None,
                          llm_start=time.time(),
                          group_id="group-1",
                          pipeline_kind="understanding",
                      )
                  ]

              assert len(chunks) == 1
              key_store.record_request_cost.assert_awaited_once()
              assert key_store.record_request_cost.await_args.kwargs["cost_usd"] == 0.0
              key_store.increment_usage.assert_awaited_once()
              assert key_store.increment_usage.await_args.kwargs["cost"] == 0.0
          '''
              test_path.write_text(tests, encoding="utf-8")
          PY

          python -m py_compile \
            aigateway-core/src/aigateway_core/dispatch/dispatcher.py \
            tests/unit/dispatch/test_dispatcher_regressions.py

      - name: Commit focused patch
        shell: bash
        run: |
          rm .github/workflows/patch-dispatcher-unpriced-cost.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aigateway-core/src/aigateway_core/dispatch/dispatcher.py \
            tests/unit/dispatch/test_dispatcher_regressions.py \
            .github/workflows/patch-dispatcher-unpriced-cost.yml
          git commit -m "fix(dispatch): normalize unknown costs at numeric sinks"
          git push origin HEAD:fix/config-hardcode-migration
