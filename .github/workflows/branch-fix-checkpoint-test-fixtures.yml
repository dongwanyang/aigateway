name: Branch Fix Checkpoint Test Fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/branch-fix-checkpoint-test-fixtures.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpu-scheduler-topology
          fetch-depth: 0

      - name: Apply compatibility test fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          impl = Path("aigateway-core/src/aigateway_core/pipelines/generation/draft/_draft_generator_impl.py")
          text = impl.read_text()
          old = 'f"comfyui_checkpoint_not_allowed: {checkpoint}"'
          new = 'f"comfyui_checkpoint_not_allowed: checkpoint not allowlisted: {checkpoint}"'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected one default checkpoint message, found {count}")
          old_dynamic = 'f"comfyui_checkpoint_not_allowed: {checkpoint_name}"'
          new_dynamic = 'f"comfyui_checkpoint_not_allowed: checkpoint not allowlisted: {checkpoint_name}"'
          count_dynamic = text.count(old_dynamic)
          if count_dynamic != 1:
              raise RuntimeError(f"expected one dynamic checkpoint message, found {count_dynamic}")
          impl.write_text(text.replace(old, new).replace(old_dynamic, new_dynamic))

          test_file = Path("tests/unit/pipeline/test_draft_generator_strategy.py")
          text = test_file.read_text()
          old_fixture = 'comfyui_config=ComfyUIConfig(workflow_version="image-v1"),'
          new_fixture = '''comfyui_config=ComfyUIConfig(
                    workflow_version="image-v1",
                    checkpoint_name="test-model.safetensors",
                    allowed_checkpoints=["test-model.safetensors"],
                    checkpoint_vram_gb={"test-model.safetensors": 8.0},
                    sdxl_required_vram_gb=8.0,
                ),'''
          if text.count(old_fixture) != 1:
              raise RuntimeError("draft strategy fixture patch mismatch")
          test_file.write_text(text.replace(old_fixture, new_fixture))
          PY

          python -m compileall -q aigateway-core/src tests/unit/pipeline
          pip install -e aigateway-core
          pip install pytest pytest-asyncio pillow
          python -m pytest \
            tests/unit/pipeline/test_draft_generator_strategy.py \
            tests/unit/pipeline/test_comfyui_progressive_workflow.py \
            tests/unit/pipeline/test_allowed_checkpoint_presets.py \
            tests/unit/pipeline/test_qwen_image_selection_policy.py \
            -q

          rm -f .github/workflows/branch-fix-checkpoint-test-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(generation): align checkpoint validation fixtures"
          git push origin HEAD:feat/gpu-scheduler-topology
