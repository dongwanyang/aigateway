name: Restore PR47 backend source of truth

on:
  push:
    branches:
      - fix/chat-video-display-and-logging

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-video-display-and-logging
          fetch-depth: 0

      - name: Restore PR47 backend conflict versions
        shell: bash
        run: |
          set -euo pipefail
          source_sha=0437c702e7d681030af821cd19cc00013e7b57c9
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$source_sha"

          paths=(
            aigateway-api/src/aigateway_api/__init__.py
            aigateway-api/src/aigateway_api/source_draft_video_routes.py
            aigateway-api/src/aigateway_api/video_generation_observability.py
            aigateway-api/src/aigateway_api/video_request_guard.py
            aigateway-core/src/aigateway_core/pipelines/generation/_common/metrics.py
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py
            tests/unit/admin/test_source_draft_video_routes.py
            tests/unit/pipeline/test_video_observability_metrics.py
          )

          for path in "${paths[@]}"; do
            if git cat-file -e "$source_sha:$path" 2>/dev/null; then
              git checkout "$source_sha" -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done

          git add -A -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore PR47 backend contract after merge"
          fi

          git rm .github/workflows/tmp-restore-pr47-backend.yml
          git commit -m "ci: remove temporary PR47 backend restorer"
          git push origin HEAD:fix/chat-video-display-and-logging
