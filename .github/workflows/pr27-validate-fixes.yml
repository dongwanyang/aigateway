name: Validate PR27 fixes

on:
  push:
    branches:
      - agent/pr1-wan22-language-prompt-plan
    paths:
      - .github/workflows/pr27-validate-fixes.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr1-wan22-language-prompt-plan
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aigateway-core/pyproject.toml
            aigateway-api/pyproject.toml
            aigateway-cli/pyproject.toml

      - name: Run validation and publish report
        shell: bash
        run: |
          set +e
          report=.gstack/pr27-validation-report.txt
          mkdir -p .gstack
          : > "$report"

          echo "PR27 validation started at $(date -u +%FT%TZ)" | tee -a "$report"
          echo "HEAD=$(git rev-parse HEAD)" | tee -a "$report"

          echo "=== INSTALL ===" | tee -a "$report"
          python -m pip install --upgrade pip >> "$report" 2>&1
          python -m pip install -e aigateway-core >> "$report" 2>&1
          install_core=$?
          python -m pip install -e "aigateway-api[dev]" >> "$report" 2>&1
          install_api=$?
          python -m pip install -e aigateway-cli >> "$report" 2>&1
          install_cli=$?
          echo "INSTALL_CORE=$install_core" | tee -a "$report"
          echo "INSTALL_API=$install_api" | tee -a "$report"
          echo "INSTALL_CLI=$install_cli" | tee -a "$report"

          focused=99
          full_unit=99
          ruff_status=99
          if [ "$install_core" -eq 0 ] && [ "$install_api" -eq 0 ] && [ "$install_cli" -eq 0 ]; then
            echo "=== FOCUSED TESTS ===" | tee -a "$report"
            python -m pytest \
              tests/unit/pipeline/test_ai_director_video_plan.py \
              tests/unit/pipeline/test_video_generation_models.py \
              tests/unit/pipeline/test_ai_director_video_plugin.py \
              tests/unit/pipeline/test_draft_video_plan_wiring.py \
              tests/unit/pipeline/test_ai_director_strategy.py \
              tests/unit/pipeline/test_ai_director_plugin.py \
              tests/unit/pipeline/test_draft_generator_strategy.py \
              tests/unit/api/test_local_generation.py \
              tests/unit/api/test_local_generation_video_languages.py \
              -q >> "$report" 2>&1
            focused=$?
            echo "FOCUSED_TESTS=$focused" | tee -a "$report"

            echo "=== FULL UNIT TESTS ===" | tee -a "$report"
            python -m pytest tests/unit/ -q >> "$report" 2>&1
            full_unit=$?
            echo "FULL_UNIT_TESTS=$full_unit" | tee -a "$report"

            echo "=== RUFF ===" | tee -a "$report"
            python -m ruff check \
              aigateway-core/src \
              aigateway-api/src \
              aigateway-cli/src \
              tests >> "$report" 2>&1
            ruff_status=$?
            echo "RUFF=$ruff_status" | tee -a "$report"
          fi

          overall=0
          for code in "$install_core" "$install_api" "$install_cli" "$focused" "$full_unit" "$ruff_status"; do
            if [ "$code" -ne 0 ]; then overall=1; fi
          done
          echo "OVERALL_STATUS=$overall" | tee -a "$report"
          echo "PR27 validation finished at $(date -u +%FT%TZ)" | tee -a "$report"

          rm -f .github/workflows/pr27-validate-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check >> "$report" 2>&1
          git add "$report"
          git commit -m "test: record PR27 validation results"
          git push origin HEAD:agent/pr1-wan22-language-prompt-plan
