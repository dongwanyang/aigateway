name: Apply PR27 fixes

on:
  push:
    branches:
      - agent/pr1-wan22-language-prompt-plan
    paths:
      - .github/workflows/pr27-apply-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr1-wan22-language-prompt-plan
          fetch-depth: 0

      - name: Decode and verify fix payload
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/pr27-fix
          mkdir -p "$work"
          cat .gstack/pr27-fix/payload.part* | base64 --decode > "$work/payload.tar.gz"
          echo "1bb001ec0dd8ba2fbf18651ef56602e7c10237d515bdebd25d1cc467d59bd0c3  $work/payload.tar.gz" | sha256sum -c -
          tar -xzf "$work/payload.tar.gz" -C "$work"

          cat > "$work/SHA256SUMS" <<'EOF'
          c56051a650fd07610106a7b336fa0acdda48ece004f06f0cc637493000a310cd  models.py
          d69914c2493120792d070c25b8ff0387366006224de5669364e563dc8bd717f6  ai_director.py
          90181f5c87b18f72d9a586fbcf7e6e71ff0495432c487036356f6a95541aaa8e  ai_director_plugin.py
          937a82fe777ab2b6735ffb548155b4bc3118602ff074212da9cebc4bc89569be  draft_generator.py
          008c849abb970a1909e1af4b26b3cf900ddb7499998567e9784998fef475e006  draft_generator_plugin.py
          b964d8923fe6911ec42f36c934e2fd9ad53e1d257f625ca7126d5c7d279ecf49  test_ai_director_video_plan.py
          0957864421ab40e624ec4d56847136fae4adde4a3e91886a4ef90b2a871f080c  test_video_generation_models.py
          d5c389775a3274af56de58dca7d58289d4e4ee1d844cba4ffa91dee41459f271  test_ai_director_video_plugin.py
          3e5282947b94a443da53e4fbac485a79c7d2c7eefb5cfa112c26b23619ea2355  test_draft_video_plan_wiring.py
          EOF
          (cd "$work" && sha256sum -c SHA256SUMS)

      - name: Install fixes and validate syntax
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/pr27-fix
          install -m 0644 "$work/models.py" aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py
          install -m 0644 "$work/ai_director.py" aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py
          install -m 0644 "$work/ai_director_plugin.py" aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director_plugin.py
          install -m 0644 "$work/draft_generator.py" aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py
          install -m 0644 "$work/draft_generator_plugin.py" aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py
          install -m 0644 "$work/test_ai_director_video_plan.py" tests/unit/pipeline/test_ai_director_video_plan.py
          install -m 0644 "$work/test_video_generation_models.py" tests/unit/pipeline/test_video_generation_models.py
          install -m 0644 "$work/test_ai_director_video_plugin.py" tests/unit/pipeline/test_ai_director_video_plugin.py
          install -m 0644 "$work/test_draft_video_plan_wiring.py" tests/unit/pipeline/test_draft_video_plan_wiring.py

          python -m py_compile \
            aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director_plugin.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py \
            tests/unit/pipeline/test_ai_director_video_plan.py \
            tests/unit/pipeline/test_video_generation_models.py \
            tests/unit/pipeline/test_ai_director_video_plugin.py \
            tests/unit/pipeline/test_draft_video_plan_wiring.py

      - name: Commit repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gstack/pr27-fix
          rm -f .github/workflows/pr27-apply-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden language-aware video planning"
          git push origin HEAD:agent/pr1-wan22-language-prompt-plan
