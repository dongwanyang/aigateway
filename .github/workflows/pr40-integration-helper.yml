name: PR40 Integration Helper

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-wan22-design-compliance
          fetch-depth: 0
      - name: Diagnose merge and publish report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines()
          out = [
              '<!-- pr40-integration-helper -->',
              '## PR #40 conflict diagnosis',
              '',
              f'Base main: `{subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()}`',
              f'Head: `{subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}`',
              '',
          ]
          if not files:
              out.extend(['No merge conflicts detected.', ''])
          else:
              out.extend([
                  f'Conflict files: **{len(files)}**',
                  '',
                  '```text',
                  *files,
                  '```',
                  '',
              ])
              for name in files:
                  out.extend([f'### `{name}`', '', '```diff'])
                  path = Path(name)
                  if not path.exists():
                      out.append('[path absent in worktree]')
                  else:
                      lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                      for index, line in enumerate(lines):
                          if not line.startswith('<<<<<<< '):
                              continue
                          start = max(0, index - 8)
                          end = min(len(lines), index + 180)
                          for lineno in range(start, end):
                              out.append(f'{lineno + 1:05d}: {lines[lineno]}')
                              if lines[lineno].startswith('>>>>>>> '):
                                  break
                  out.extend(['```', ''])
          Path('/tmp/pr40-conflicts.md').write_text('\n'.join(out), encoding='utf-8')
          Path('/tmp/pr40-has-conflicts').write_text('1' if files else '0', encoding='utf-8')
          PY
          gh pr comment 40 --repo dongwanyang/aigateway --body-file /tmp/pr40-conflicts.md
          test "$(cat /tmp/pr40-has-conflicts)" = 0
