name: PR40 Integration Helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr40-integration-helper.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-wan22-design-compliance
          fetch-depth: 0
      - name: Merge main with document-guided conflict policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'aigateway-api/src/aigateway_api/__init__.py',
              'aigateway-api/src/aigateway_api/source_draft_video_routes.py',
              'aigateway-api/src/aigateway_api/video_generation_observability.py',
              'aigateway-api/src/aigateway_api/video_request_guard.py',
              'aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py',
              'aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py',
              'aigateway-core/src/aigateway_core/pipelines/generation/draft/source_draft_video.py',
              'control-panel/src/api/consoleChat.test.ts',
              'control-panel/src/api/consoleChat.ts',
              'control-panel/src/api/sourceDraftVideo.test.ts',
              'control-panel/src/api/sourceDraftVideo.ts',
              'control-panel/src/hooks/useChatSessions.ts',
              'control-panel/src/pages/Chat.tsx',
              'control-panel/src/types.ts',
              'docker-compose.yml',
              'scripts/render-deployment-config.py',
              'scripts/render-gpu-topology.py',
              'tests/unit/admin/test_source_draft_video_routes.py',
              'tests/unit/pipeline/test_draft_confirmation_recovery_state.py',
          }
          conflicts = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines())
          if conflicts != expected:
              missing = sorted(expected - conflicts)
              extra = sorted(conflicts - expected)
              raise SystemExit(f'unexpected conflict set; missing={missing}; extra={extra}')

          # These files were not part of PR #40's intentional document-goal delta.
          # Keep the already-merged main versions to preserve GPU topology safety,
          # the canonical shared request types, and deployment config locking.
          prefer_main = {
              'aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py',
              'control-panel/src/types.ts',
              'scripts/render-deployment-config.py',
              'scripts/render-gpu-topology.py',
          }
          combine_both = {'docker-compose.yml'}

          def is_separator(line: str) -> bool:
              return line.rstrip('\r\n') == '======='

          def resolve(text: str, mode: str) -> str:
              lines = text.splitlines(keepends=True)
              output: list[str] = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith('<<<<<<< '):
                      output.append(lines[i])
                      i += 1
                      continue
                  i += 1
                  ours: list[str] = []
                  while i < len(lines) and not is_separator(lines[i]):
                      ours.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise ValueError('unterminated ours block')
                  i += 1
                  theirs: list[str] = []
                  while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                      theirs.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise ValueError('unterminated theirs block')
                  i += 1
                  if mode == 'pr40':
                      output.extend(ours)
                  elif mode == 'main':
                      output.extend(theirs)
                  elif mode == 'both':
                      output.extend(ours)
                      output.extend(theirs)
                  else:
                      raise ValueError(mode)
              return ''.join(output)

          def has_conflict_markers(text: str) -> bool:
              return any(
                  line.startswith('<<<<<<< ')
                  or is_separator(line)
                  or line.startswith('>>>>>>> ')
                  for line in text.splitlines(keepends=True)
              )

          for name in sorted(conflicts):
              mode = 'main' if name in prefer_main else 'both' if name in combine_both else 'pr40'
              path = Path(name)
              merged = resolve(path.read_text(encoding='utf-8'), mode)
              if has_conflict_markers(merged):
                  raise SystemExit(f'conflict marker remains in {name}')
              path.write_text(merged, encoding='utf-8')
              subprocess.run(['git', 'add', '--', name], check=True)

          diagnostic = Path('.github/workflows/diagnose-pr40-main-conflicts.yml')
          if diagnostic.exists():
              diagnostic.unlink()
              subprocess.run(['git', 'add', '-u', '--', str(diagnostic)], check=True)

          remaining = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).strip()
          if remaining:
              raise SystemExit(f'unresolved files remain: {remaining}')
          PY

          git diff --check
          git commit -m 'merge: integrate PR40 lifecycle fixes with main'
          new_sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/fix-wan22-design-compliance
          cat > /tmp/pr40-resolution.md <<EOF
          <!-- pr40-integration-resolution -->
          ## PR #40 conflicts resolved against implementation-plan goals

          Integrated current \`main\` into the PR branch using the Wan2.2 implementation plan as the acceptance baseline.

          - Retained PR #40 request recovery, verified cancellation, source-draft ownership, frozen-input and runtime observability behavior.
          - Retained current \`main\` for GPU topology/deployment renderers and canonical shared types where PR #40 had no intentional delta.
          - Preserved both runtime identity variables and GPU isolation configuration in \`docker-compose.yml\`.
          - Preserved all non-conflicting Git hunks from both branches.
          - Removed the temporary branch diagnostic workflow.

          New head: \`$new_sha\`
          EOF
          gh pr comment 40 --repo dongwanyang/aigateway --body-file /tmp/pr40-resolution.md
