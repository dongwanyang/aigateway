name: Collapse PR26 Facades

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  collapse:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-report-2026-08-02
          fetch-depth: 0
      - name: Collapse compatibility facades
        run: python scripts/collapse_pr26_facades.py
      - name: Commit canonical modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            aigateway-core/src/aigateway_core/shared/gpu_scheduler.py \
            aigateway-core/src/aigateway_core/shared/_gpu_scheduler_impl.py \
            aigateway-core/src/aigateway_core/route/model_resolution/model_router.py \
            aigateway-core/src/aigateway_core/route/model_resolution/_model_router_impl.py \
            aigateway-core/src/aigateway_core/shared/plugin_registry.py \
            aigateway-core/src/aigateway_core/shared/_plugin_registry_impl.py
          git commit -m "refactor: inline merge fixes into canonical modules"
          git push origin HEAD:agent/fix-qa-report-2026-08-02
