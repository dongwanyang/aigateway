name: Branch GPU Scheduler Fix

on:
  push:
    branches:
      - feat/gpu-scheduler-topology
    paths:
      - .github/workflows/branch-fix-gpu-scheduler.yml
      - .github/scripts/apply_gpu_scheduler_review_fixes.py.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-gpu-scheduler-fix
  cancel-in-progress: false

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpu-scheduler-topology
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode and apply fixes
        run: |
          base64 --decode .github/scripts/apply_gpu_scheduler_review_fixes.py.gz.b64 \
            | gzip --decompress \
            > .github/scripts/apply_gpu_scheduler_review_fixes.py
          python .github/scripts/apply_gpu_scheduler_review_fixes.py
          python -m compileall -q aigateway-core/src aigateway-api/src tests/unit

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e aigateway-core -e aigateway-api pytest pytest-asyncio pyyaml

      - name: Run targeted regression tests
        run: |
          python -m pytest -q \
            tests/unit/test_gpu_scheduler.py \
            tests/unit/test_gpu_scheduler_regressions.py \
            tests/unit/api/test_cuda_memory_limit.py \
            tests/unit/pipeline/test_prompt_compress_plugin.py \
            tests/unit/pipeline/test_gpu_lease_cancellation.py \
            tests/unit/pipeline/test_gpu_runtime_device_requests.py \
            tests/unit/cli/test_gpu_topology_renderer.py \
            tests/unit/cli/test_quickstart_script.py

      - name: Commit fixes to feature branch
        run: |
          rm -f \
            .github/scripts/apply_gpu_scheduler_review_fixes.py \
            .github/scripts/apply_gpu_scheduler_review_fixes.py.gz.b64 \
            .github/workflows/branch-fix-gpu-scheduler.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(gpu): harden scheduler lease lifecycle"
          git push origin HEAD:feat/gpu-scheduler-topology
