name: Repair PR27 implementation

on:
  push:
    branches:
      - agent/pr1-wan22-language-prompt-plan
    paths:
      - .github/workflows/pr27-fix-all.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr1-wan22-language-prompt-plan
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aigateway-core/pyproject.toml
            aigateway-api/pyproject.toml

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Pillow is imported unconditionally by the draft module, so it is a
          # base runtime dependency rather than an optional vision-only extra.
          path = "aigateway-core/pyproject.toml"
          text = read(path)
          base_deps = text.split("[project.optional-dependencies]", 1)[0]
          if '"Pillow>=10.0.0"' not in base_deps:
              text = replace_once(
                  text,
                  '    "httpx>=0.24.0",\n',
                  '    "httpx>=0.24.0",\n    "Pillow>=10.0.0",\n',
                  "add Pillow runtime dependency",
              )
          write(path, text)

          # Model-aware Director: normalize Wan lengths to 4n+1 and fail closed
          # when a required language conversion cannot be performed safely.
          path = "aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py"
          text = read(path)
          text = text.replace("_MAX_VIDEO_FRAMES = 480", "_MAX_VIDEO_FRAMES = 481")
          old = '''    ) -> VideoGenerationPlan:\n        keyframe_prompt, motion_prompt = _split_fallback_video_prompt(\n'''
          new = '''    ) -> VideoGenerationPlan:\n        if (\n            keyframe_language != source_language\n            or motion_language != source_language\n        ):\n            raise ValueError("video_prompt_language_conversion_unavailable")\n        keyframe_prompt, motion_prompt = _split_fallback_video_prompt(\n'''
          if "video_prompt_language_conversion_unavailable" not in text:
              text = replace_once(text, old, new, "fail-closed video fallback")
          old = '''    frame_count = round(duration * fps)\n    if frame_count <= 0 or frame_count > _MAX_VIDEO_FRAMES:\n        raise ValueError("frame_count_out_of_range")\n    return duration, fps, frame_count\n'''
          new = '''    requested_frames = round(duration * fps)\n    if requested_frames <= 0:\n        raise ValueError("frame_count_out_of_range")\n    frame_count = ((requested_frames - 1 + 3) // 4) * 4 + 1\n    if frame_count > _MAX_VIDEO_FRAMES:\n        raise ValueError("frame_count_out_of_range")\n    return duration, fps, frame_count\n'''
          text = replace_once(text, old, new, "normalize Wan frame count")
          write(path, text)

          # Domain model enforces the same timing contract as the Director and
          # the ComfyUI workflow consumer.
          path = "aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py"
          text = read(path)
          old = '''        if (\n            isinstance(self.frame_count, bool)\n            or not isinstance(self.frame_count, int)\n            or self.frame_count <= 0\n        ):\n            raise ValueError("frame_count must be a positive integer")\n'''
          new = old + '''        requested_frames = round(float(self.duration_seconds) * self.fps)\n        normalized_frames = ((requested_frames - 1 + 3) // 4) * 4 + 1\n        if self.frame_count != normalized_frames:\n            raise ValueError("frame_count must match normalized duration and fps")\n'''
          if "frame_count must match normalized duration and fps" not in text:
              text = replace_once(text, old, new, "validate normalized frame count")
          write(path, text)

          # Draft adapter validates the normalized plan rather than the raw
          # duration*fps product, and blocks a known Director failure from being
          # silently submitted as an unrelated local image draft.
          path = "aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py"
          text = read(path)
          old = '''            request = self._build_generation_request(ctx)\n            backend = str(options.get("backend") or "auto")\n'''
          new = '''            request = self._build_generation_request(ctx)\n            director = ctx.extra.get(NS_GENERATION_OPTIMIZATION, {}).get(\n                "ai_director", {}\n            )\n            if (\n                request.media_type == "video"\n                and not request.motion_prompt\n                and isinstance(director, dict)\n                and director.get("error")\n            ):\n                raise DraftWorkflowError("video_prompt_plan_unavailable")\n            backend = str(options.get("backend") or "auto")\n'''
          if "video_prompt_plan_unavailable" not in text:
              text = replace_once(text, old, new, "block failed video plan")
          old = '''            expected_count = round(duration_seconds * target_fps)\n            if frame_count != expected_count:\n                raise ValueError("video_plan_frame_count_mismatch")\n'''
          new = '''            requested_count = round(duration_seconds * target_fps)\n            expected_count = ((requested_count - 1 + 3) // 4) * 4 + 1\n            if frame_count != expected_count:\n                raise ValueError("video_plan_frame_count_mismatch")\n'''
          text = replace_once(text, old, new, "validate video plan timing")
          old = '''            frame_count = (\n                round(duration_seconds * target_fps)\n                if media_type == "video"\n                else None\n            )\n'''
          new = '''            if media_type == "video":\n                requested_count = round(duration_seconds * target_fps)\n                frame_count = ((requested_count - 1 + 3) // 4) * 4 + 1\n            else:\n                frame_count = None\n'''
          text = replace_once(text, old, new, "normalize legacy video timing")
          write(path, text)

          # Persist a hash of the exact preview bytes, verify it before Wan
          # submission, and apply frozen frame_count/fps to the real workflow.
          path = "aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py"
          text = read(path)
          if "import hashlib" not in text:
              text = text.replace("import os\n", "import hashlib\nimport hmac\nimport math\nimport os\n", 1)
          text = text.replace(
              '                    "source_image_sha256": request.source_image_sha256,',
              '                    "source_image_sha256": None,',
          )
          marker = '''        return draft\n\n    async def _generate_video_with_comfyui(self, draft):\n'''
          insertion = '''        return draft\n\n    async def _generate_draft_async(self, *args, **kwargs):\n        await super()._generate_draft_async(*args, **kwargs)\n        draft_id = kwargs.get("draft_id") or (args[0] if args else None)\n        if not draft_id:\n            return\n        draft = await self._load_draft(str(draft_id))\n        if (\n            draft is None\n            or draft.media_type != "video"\n            or draft.status != _impl.DRAFT_STATUS_PENDING\n            or not draft.previews\n        ):\n            return\n        params = draft.generation_params\n        params["source_image_sha256"] = hashlib.sha256(\n            draft.previews[0]\n        ).hexdigest()\n        params["source_kind"] = (\n            "source_draft"\n            if params.get("source_draft_id")\n            else "uploaded"\n            if params.get("has_reference_image")\n            else "generated_keyframe"\n        )\n        await self._store_draft(\n            draft,\n            max(1, int(draft.expires_at - time.time())),\n        )\n\n    async def _generate_video_with_comfyui(self, draft):\n'''
          if "async def _generate_draft_async(self, *args, **kwargs)" not in text:
              text = replace_once(text, marker, insertion, "persist video keyframe hash")
          old = '''        await self._ensure_storage_capacity()\n        input_name = await self._upload_image(\n            draft.previews[0], f"video-keyframe-{draft.draft_id}.png"\n        )\n        motion_prompt = str(\n'''
          new = '''        expected_hash = str(\n            draft.generation_params.get("source_image_sha256") or ""\n        )\n        actual_hash = hashlib.sha256(draft.previews[0]).hexdigest()\n        if not expected_hash:\n            raise DraftWorkflowError("video_keyframe_integrity_missing")\n        if not hmac.compare_digest(actual_hash, expected_hash):\n            raise DraftWorkflowError("video_keyframe_integrity_mismatch")\n        frame_count = self._video_frame_count(draft)\n        fps = self._video_fps(draft)\n        await self._ensure_storage_capacity()\n        input_name = await self._upload_image(\n            draft.previews[0], f"video-keyframe-{draft.draft_id}.png"\n        )\n        motion_prompt = str(\n'''
          if "video_keyframe_integrity_missing" not in text:
              text = replace_once(text, old, new, "verify video keyframe integrity")
          old = '''        workflow = self._build_video_workflow(\n            input_name=input_name,\n            prompt=motion_prompt,\n            seed=int(draft.generation_params.get("seed", 0)),\n            draft_id=draft.draft_id,\n        )\n        async with self._comfyui_semaphore:\n'''
          new = '''        workflow = self._build_video_workflow(\n            input_name=input_name,\n            prompt=motion_prompt,\n            seed=int(draft.generation_params.get("seed", 0)),\n            draft_id=draft.draft_id,\n        )\n        self._apply_video_timing(\n            workflow,\n            frame_count=frame_count,\n            fps=fps,\n        )\n        async with self._comfyui_semaphore:\n'''
          text = replace_once(text, old, new, "apply frozen video timing")
          marker = '''        return result\n\n    @staticmethod\n    def _pool_has_worker(status: Any, capability: str) -> bool:\n'''
          insertion = '''        return result\n\n    @staticmethod\n    def _video_frame_count(draft: Any) -> int:\n        value = draft.generation_params.get("frame_count")\n        if (\n            isinstance(value, bool)\n            or not isinstance(value, int)\n            or value <= 0\n            or value % 4 != 1\n        ):\n            raise DraftWorkflowError("video_duration_unsupported")\n        return value\n\n    @staticmethod\n    def _video_fps(draft: Any) -> float:\n        value = draft.generation_params.get("fps")\n        if (\n            isinstance(value, bool)\n            or not isinstance(value, (int, float))\n            or not math.isfinite(float(value))\n            or float(value) <= 0\n        ):\n            raise DraftWorkflowError("video_fps_invalid")\n        return float(value)\n\n    @staticmethod\n    def _apply_video_timing(\n        workflow: dict[str, Any],\n        *,\n        frame_count: int,\n        fps: float,\n    ) -> None:\n        try:\n            workflow["5"]["inputs"]["length"] = frame_count\n            workflow["11"]["inputs"]["fps"] = fps\n        except (KeyError, TypeError) as exc:\n            raise DraftWorkflowError("comfyui_video_workflow_invalid") from exc\n\n    @staticmethod\n    def _pool_has_worker(status: Any, capability: str) -> bool:\n'''
          if "def _apply_video_timing(" not in text:
              text = replace_once(text, marker, insertion, "add video timing helpers")
          write(path, text)

          # Tests: update 5s@8fps to the valid Wan length 41, change unsafe
          # Chinese fallbacks to fail-closed assertions, and verify workflow
          # timing plus integrity enforcement.
          path = "tests/unit/pipeline/test_ai_director_video_plan.py"
          text = read(path)
          text = text.replace("assert plan.frame_count == 40", "assert plan.frame_count == 41")
          start = text.index("@pytest.mark.asyncio\n@pytest.mark.parametrize(\n    (\"content\", \"expected_reason\"),")
          end = text.index("\n\n@pytest.mark.asyncio\nasync def test_video_plan_timeout_is_traceable", start)
          replacement = '''@pytest.mark.asyncio\n@pytest.mark.parametrize(\n    ("content", "expected_reason"),\n    [\n        ("not-json", "invalid_json"),\n        ("", "empty_response"),\n        ('{"keyframe_prompt":"frame only"}', "missing_motion_prompt"),\n    ],\n)\nasync def test_invalid_english_video_plan_uses_safe_fallback(\n    config, ctx, content, expected_reason\n):\n    plan = await AIDirectorStrategy(\n        config=config, litellm_bridge=_bridge(content)\n    ).build_video_generation_plan(\n        "A yellow and white corgi runs toward the camera",\n        [],\n        config,\n        ctx,\n    )\n\n    assert plan.keyframe_language == "en"\n    assert plan.motion_language == "en"\n    assert "runs toward" not in plan.keyframe_prompt.lower()\n    assert "static pose" in plan.keyframe_prompt\n    assert plan.fallback_reason == expected_reason\n\n\n@pytest.mark.asyncio\nasync def test_invalid_chinese_plan_fails_when_translation_is_unavailable(\n    config, ctx\n):\n    strategy = AIDirectorStrategy(\n        config=config, litellm_bridge=_bridge("not-json")\n    )\n    with pytest.raises(\n        ValueError, match="video_prompt_language_conversion_unavailable"\n    ):\n        await strategy.build_video_generation_plan(\n            "一只黄白色柯基在草地上，摇尾巴并向镜头跑来",\n            [],\n            config,\n            ctx,\n        )'''
          text = text[:start] + replacement + text[end:]
          old = '''@pytest.mark.asyncio\nasync def test_no_bridge_fallback_records_language_conversion(config, ctx):\n    plan = await AIDirectorStrategy(\n        config=config, litellm_bridge=None\n    ).build_video_generation_plan(\n        "一只柯基向镜头跑来",\n        [],\n        config,\n        ctx,\n    )\n\n    assert plan.fallback_reason == "no_bridge"\n    assert plan.language_fallback_reason == (\n        "keyframe:target_model_language_unsupported"\n    )\n    assert plan.keyframe_language == "en"\n    assert plan.motion_language == "zh"\n'''
          new = '''@pytest.mark.asyncio\nasync def test_no_bridge_fails_when_chinese_keyframe_requires_translation(\n    config, ctx\n):\n    strategy = AIDirectorStrategy(config=config, litellm_bridge=None)\n    with pytest.raises(\n        ValueError, match="video_prompt_language_conversion_unavailable"\n    ):\n        await strategy.build_video_generation_plan(\n            "一只柯基向镜头跑来",\n            [],\n            config,\n            ctx,\n        )\n'''
          text = replace_once(text, old, new, "update no-bridge fallback test")
          append = '''\n\n@pytest.mark.asyncio\n@pytest.mark.parametrize(\n    ("duration", "expected_frames"),\n    [(3, 25), (5, 41), (8, 65)],\n)\nasync def test_video_timing_normalizes_to_wan_length(\n    config, ctx, duration, expected_frames\n):\n    plan = await AIDirectorStrategy(\n        config=config, litellm_bridge=_bridge(\n            '{"keyframe_prompt":"A corgi stands still on grass",'\n            '"motion_prompt":"The corgi runs forward"}'\n        )\n    ).build_video_generation_plan(\n        "A corgi runs forward",\n        [],\n        config,\n        ctx,\n        duration_seconds=duration,\n        fps=8,\n    )\n    assert plan.frame_count == expected_frames\n'''
          if "test_video_timing_normalizes_to_wan_length" not in text:
              text += append
          write(path, text)

          for path in (
              "tests/unit/pipeline/test_ai_director_video_plugin.py",
              "tests/unit/pipeline/test_video_generation_models.py",
          ):
              text = read(path)
              text = text.replace("frame_count=40", "frame_count=41")
              text = text.replace('"frame_count": 40', '"frame_count": 41')
              text = text.replace("== 40", "== 41")
              write(path, text)

          path = "tests/unit/pipeline/test_draft_video_plan_wiring.py"
          text = read(path)
          text = text.replace("import asyncio\n", "import asyncio\nimport hashlib\n", 1)
          text = text.replace('"frame_count": 40,', '"frame_count": 41,', 1)
          text = text.replace('plan["frame_count"] = 41', 'plan["frame_count"] = 40')
          old = 'strategy._build_video_workflow = MagicMock(return_value={"workflow": True})'
          new = '''workflow = {"5": {"inputs": {}}, "11": {"inputs": {}}}\n    strategy._build_video_workflow = MagicMock(return_value=workflow)'''
          text = replace_once(text, old, new, "use mutable video workflow fixture")
          text = text.replace(
              '            "trace_id": "trace-video",\n',
              '            "trace_id": "trace-video",\n            "frame_count": 41,\n            "fps": 8,\n            "source_image_sha256": hashlib.sha256(b"png").hexdigest(),\n',
              1,
          )
          old = '''    strategy._build_video_workflow.assert_called_once_with(\n        input_name="keyframe.png",\n        prompt="motion-only prompt",\n        seed=7,\n        draft_id="draft-video",\n    )\n'''
          new = old + '''    assert workflow["5"]["inputs"]["length"] == 41\n    assert workflow["11"]["inputs"]["fps"] == 8.0\n'''
          text = replace_once(text, old, new, "assert dynamic workflow timing")
          append = '''\n\n@pytest.mark.asyncio\nasync def test_wan_confirmation_rejects_changed_keyframe_bytes():\n    strategy = object.__new__(DraftGeneratorStrategy)\n    strategy._comfyui_config = SimpleNamespace(\n        video_enabled=True,\n        video_execution_timeout=30,\n    )\n    draft = DraftResult(\n        draft_id="draft-integrity",\n        previews=[b"changed"],\n        generation_params={\n            "source_image_sha256": hashlib.sha256(b"original").hexdigest(),\n            "frame_count": 41,\n            "fps": 8,\n        },\n        created_at=0,\n        expires_at=100,\n        media_type="video",\n    )\n\n    with pytest.raises(\n        Exception, match="video_keyframe_integrity_mismatch"\n    ):\n        await strategy._generate_video_with_comfyui(draft)\n'''
          if "test_wan_confirmation_rejects_changed_keyframe_bytes" not in text:
              text += append
          write(path, text)

          Path("pr27-validation-report.txt").unlink(missing_ok=True)
          PY

      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e aigateway-core
          python -m pip install -e "aigateway-api[dev]"
          python -m pip install -e aigateway-cli

      - name: Format changed Python files
        run: |
          python -m ruff check --fix \
            aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director_plugin.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py \
            tests/unit/api/test_local_generation_video_languages.py \
            tests/unit/pipeline/test_ai_director_video_plan.py \
            tests/unit/pipeline/test_ai_director_video_plugin.py \
            tests/unit/pipeline/test_draft_video_plan_wiring.py \
            tests/unit/pipeline/test_video_generation_models.py
          python -m ruff format \
            aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director_plugin.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py \
            tests/unit/api/test_local_generation_video_languages.py \
            tests/unit/pipeline/test_ai_director_video_plan.py \
            tests/unit/pipeline/test_ai_director_video_plugin.py \
            tests/unit/pipeline/test_draft_video_plan_wiring.py \
            tests/unit/pipeline/test_video_generation_models.py

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/unit/pipeline/test_ai_director_video_plan.py \
            tests/unit/pipeline/test_video_generation_models.py \
            tests/unit/pipeline/test_ai_director_video_plugin.py \
            tests/unit/pipeline/test_draft_video_plan_wiring.py \
            tests/unit/pipeline/test_ai_director_strategy.py \
            tests/unit/pipeline/test_ai_director_plugin.py \
            tests/unit/pipeline/test_draft_generator_strategy.py \
            tests/unit/api/test_local_generation.py \
            tests/unit/api/test_local_generation_video_languages.py \
            -q

      - name: Verify changed files
        run: |
          python -m ruff check \
            aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py \
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director_plugin.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py \
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py \
            tests/unit/api/test_local_generation_video_languages.py \
            tests/unit/pipeline/test_ai_director_video_plan.py \
            tests/unit/pipeline/test_ai_director_video_plugin.py \
            tests/unit/pipeline/test_draft_video_plan_wiring.py \
            tests/unit/pipeline/test_video_generation_models.py
          git diff --check

      - name: Commit repaired implementation
        run: |
          rm -f .github/workflows/pr27-fix-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete Wan video plan wiring and validation"
          git push origin HEAD:agent/pr1-wan22-language-prompt-plan
