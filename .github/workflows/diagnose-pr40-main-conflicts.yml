name: Diagnose PR40 Main Conflicts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pr40-main-conflicts.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-wan22-design-compliance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-wan22-design-compliance
          fetch-depth: 0
      - name: Inspect merge conflicts against main
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          echo '=== CONFLICT FILES ==='
          git diff --name-only --diff-filter=U
          echo '=== CONFLICT STAGES ==='
          git ls-files -u
          echo '=== CONFLICT HUNKS ==='
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines()
          for name in files:
              print(f'\n##### {name} #####')
              path = Path(name)
              if not path.exists():
                  print('[path absent in worktree]')
                  continue
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              marker_indexes = [
                  i for i, line in enumerate(lines)
                  if line.startswith('<<<<<<< ')
              ]
              for index in marker_indexes:
                  start = max(0, index - 8)
                  end = min(len(lines), index + 120)
                  for lineno in range(start, end):
                      print(f'{lineno + 1:05d}: {lines[lineno]}')
                      if lines[lineno].startswith('>>>>>>> '):
                          break
          if files:
              raise SystemExit(1)
          PY
