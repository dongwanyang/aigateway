name: Restore PR47 frontend source of truth

on:
  push:
    branches:
      - fix/chat-video-display-and-logging

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-video-display-and-logging
          fetch-depth: 0

      - name: Restore PR47 frontend versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 0437c702e7d681030af821cd19cc00013e7b57c9
          git checkout 0437c702e7d681030af821cd19cc00013e7b57c9 -- \
            control-panel/src/hooks/useChatSessions.ts \
            control-panel/src/api/sourceDraftVideo.ts \
            control-panel/src/api/sourceDraftVideo.test.ts
          git add -- \
            control-panel/src/hooks/useChatSessions.ts \
            control-panel/src/api/sourceDraftVideo.ts \
            control-panel/src/api/sourceDraftVideo.test.ts
          git commit -m "fix: restore PR47 frontend contract after merge"
          git rm .github/workflows/tmp-restore-pr47-frontend.yml
          git commit -m "ci: remove temporary PR47 frontend restorer"
          git push origin HEAD:fix/chat-video-display-and-logging
