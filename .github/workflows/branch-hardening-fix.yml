              redis.call('sadd', KEYS[2], ARGV[1])
              redis.call('expire', KEYS[2], ARGV[2])
              return 1
              """
              fence_at = self._clock() + max(0.0, ttl - interval)
              while True:
                  try:
                      await asyncio.sleep(interval)
                      if self._redis is None:
                          continue
                      renewed = await self._redis.eval(
                          script,
                          2,
                          key,
