              @property
              def gpu_device_request(self) -> str:
                  components = self._gpu_bound_components()
                  if not components:
                      return "cpu"
                  explicit = {
                      device
                      for _, device in components
                      if device not in {"auto", "cuda"}
                  }
                  if len(explicit) > 1:
                      raise RuntimeError("rag_multiple_gpu_devices_not_supported")
                  if explicit:
