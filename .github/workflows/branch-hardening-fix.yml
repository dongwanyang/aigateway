name: Branch hardening fix

on:
  push:
    branches: [feat/gpu-scheduler-topology]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
