              '''from __future__ import annotations

              import asyncio
              import importlib.util
              from pathlib import Path

              import pytest
              from aigateway_core.pipelines.understanding.rag.rag_retriever_plugin import (
                  RAGRetrieverPlugin,
              )
              from aigateway_core.shared.gpu_scheduler import (
                  GpuDevice,
                  GpuResourceCoordinator,
                  GpuSchedulerConfig,
              )
              from aigateway_core.shared.integration_configs import RAGRetrieverConfig


              @pytest.mark.asyncio
              async def test_disabled_scheduler_preserves_requested_device() -> None:
                  coordinator = GpuResourceCoordinator(
                      GpuSchedulerConfig.from_mapping({"enabled": False}),
                      devices=[GpuDevice("GPU-a", 0, free_memory_gb=16)],
                  )
                  async with coordinator.gateway_lease("embedding", "cuda:0") as lease:
                      assert lease.device == "cuda:0"
                      assert lease.device_uuid is None


              def test_rag_cpu_embedding_is_not_overridden_by_gpu_reranker() -> None:
                  plugin = RAGRetrieverPlugin(
                      RAGRetrieverConfig(
                          embedding_backend="local",
                          embedding_device="cpu",
                          rerank_backend="local",
                          rerank_device="cuda",
                      )
                  )
                  assert plugin.gpu_device_request == "cuda"
                  plugin.set_runtime_device("cuda:1")
                  assert plugin._runtime_embedding_device == "cpu"
                  assert plugin._runtime_rerank_device == "cuda:1"


              def test_rag_rejects_two_explicit_gpu_devices() -> None:
                  plugin = RAGRetrieverPlugin(
                      RAGRetrieverConfig(
                          embedding_backend="local",
                          embedding_device="cuda:0",
                          rerank_backend="local",
                          rerank_device="cuda:1",
                      )
                  )
                  with pytest.raises(RuntimeError, match="multiple_gpu"):
                      _ = plugin.gpu_device_request


              def test_controller_compose_env_precedence_matches_quickstart() -> None:
                  repo_root = Path(__file__).resolve().parents[2]
                  script = repo_root / "scripts" / "gpu-topology-controller.py"
                  spec = importlib.util.spec_from_file_location("gpu_controller_merge", script)
                  assert spec and spec.loader
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  command = module._compose_command(
                      repo_root,
                      repo_root / ".aigateway-install.env",
                      repo_root / ".aigateway/runtime/docker-compose.gpu.generated.yml",
                      {"AIGATEWAY_ACCELERATOR": "cuda"},
                  )
                  project_index = command.index(str(repo_root / ".env"))
                  state_index = command.index(str(repo_root / ".aigateway-install.env"))
                  assert project_index < state_index


              def test_automatic_privileged_controller_installer_removed() -> None:
                  repo_root = Path(__file__).resolve().parents[2]
                  assert not (repo_root / "scripts/install-gpu-topology-controller.sh").exists()
                  quickstart = (repo_root / "scripts/quickstart.sh").read_text(encoding="utf-8")
                  assert "install-gpu-topology-controller.sh" not in quickstart
              '''.replace("              ", ""),
