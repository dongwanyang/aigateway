name: Agent Apply Backend Runtime Correctness

on:
  push:
    branches:
      - agent/fix-backend-runtime-correctness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_backend_runtime_correctness.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aigateway-api/src/aigateway_api/main.py \
                  aigateway-api/src/aigateway_api/admin_routes.py \
                  aigateway-api/src/aigateway_api/local_generation.py \
                  tests/unit/test_runtime_correctness_regressions.py
          git commit -m 'fix: harden backend runtime correctness'
          git push origin HEAD
