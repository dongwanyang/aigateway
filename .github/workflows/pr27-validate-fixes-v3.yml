name: Validate PR27 fixes v3

on:
  push:
    branches:
      - agent/pr1-wan22-language-prompt-plan
    paths:
      - .github/workflows/pr27-validate-fixes-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr1-wan22-language-prompt-plan
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aigateway-core/pyproject.toml
            aigateway-api/pyproject.toml
            aigateway-cli/pyproject.toml

      - name: Validate with standard test prerequisites
        shell: bash
        run: |
          set +e
          report=pr27-validation-report.txt
          install_log=/tmp/pr27-install.log
          focused_log=/tmp/pr27-focused.log
          unit_log=/tmp/pr27-unit.log
          changed_ruff_log=/tmp/pr27-changed-ruff.log
          full_ruff_log=/tmp/pr27-full-ruff.log
          : > "$report"

          python -m pip install --upgrade pip > "$install_log" 2>&1
          python -m pip install -e aigateway-core >> "$install_log" 2>&1
          install_core=$?
          python -m pip install -e "aigateway-api[dev]" >> "$install_log" 2>&1
          install_api=$?
          python -m pip install -e aigateway-cli >> "$install_log" 2>&1
          install_cli=$?
          python -m pip install Pillow >> "$install_log" 2>&1
          install_pillow=$?

          changed_files=(
            aigateway-api/src/aigateway_api/local_generation.py
            aigateway-core/src/aigateway_core/pipelines/generation/_common/models.py
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director.py
            aigateway-core/src/aigateway_core/pipelines/generation/director/ai_director_plugin.py
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator.py
            aigateway-core/src/aigateway_core/pipelines/generation/draft/draft_generator_plugin.py
            tests/unit/api/test_local_generation_video_languages.py
            tests/unit/pipeline/test_ai_director_video_plan.py
            tests/unit/pipeline/test_ai_director_video_plugin.py
            tests/unit/pipeline/test_draft_video_plan_wiring.py
            tests/unit/pipeline/test_video_generation_models.py
          )

          focused=99
          full_unit=99
          changed_ruff=99
          full_ruff=99
          if [ "$install_core" -eq 0 ] && [ "$install_api" -eq 0 ] && [ "$install_cli" -eq 0 ] && [ "$install_pillow" -eq 0 ]; then
            python -m ruff check --fix "${changed_files[@]}" > "$changed_ruff_log" 2>&1
            python -m ruff check "${changed_files[@]}" >> "$changed_ruff_log" 2>&1
            changed_ruff=$?

            python -m pytest \
              tests/unit/pipeline/test_ai_director_video_plan.py \
              tests/unit/pipeline/test_video_generation_models.py \
              tests/unit/pipeline/test_ai_director_video_plugin.py \
              tests/unit/pipeline/test_draft_video_plan_wiring.py \
              tests/unit/pipeline/test_ai_director_strategy.py \
              tests/unit/pipeline/test_ai_director_plugin.py \
              tests/unit/pipeline/test_draft_generator_strategy.py \
              tests/unit/api/test_local_generation.py \
              tests/unit/api/test_local_generation_video_languages.py \
              -q > "$focused_log" 2>&1
            focused=$?

            python -m pytest tests/unit/ -q > "$unit_log" 2>&1
            full_unit=$?

            python -m ruff check \
              aigateway-core/src \
              aigateway-api/src \
              aigateway-cli/src \
              tests > "$full_ruff_log" 2>&1
            full_ruff=$?
          fi

          overall=0
          for code in "$install_core" "$install_api" "$install_cli" "$install_pillow" "$focused" "$full_unit" "$changed_ruff"; do
            if [ "$code" -ne 0 ]; then overall=1; fi
          done

          {
            echo "PR27 validation started at $(date -u +%FT%TZ)"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "INSTALL_CORE=$install_core"
            echo "INSTALL_API=$install_api"
            echo "INSTALL_CLI=$install_cli"
            echo "INSTALL_PILLOW_TEST_PREREQ=$install_pillow"
            echo "FOCUSED_TESTS=$focused"
            echo "FULL_UNIT_TESTS=$full_unit"
            echo "CHANGED_FILES_RUFF=$changed_ruff"
            echo "FULL_REPO_RUFF_BASELINE=$full_ruff"
            echo "OVERALL_STATUS=$overall"
            echo "PR27 validation finished at $(date -u +%FT%TZ)"
            echo
            echo "=== INSTALL LOG (tail 80) ==="
            tail -n 80 "$install_log" 2>/dev/null || true
            echo
            echo "=== CHANGED FILES RUFF LOG (tail 300) ==="
            tail -n 300 "$changed_ruff_log" 2>/dev/null || true
            echo
            echo "=== FOCUSED TEST LOG (tail 500) ==="
            tail -n 500 "$focused_log" 2>/dev/null || true
            echo
            echo "=== FULL UNIT LOG (tail 500) ==="
            tail -n 500 "$unit_log" 2>/dev/null || true
            echo
            echo "=== FULL RUFF BASELINE LOG (tail 300) ==="
            tail -n 300 "$full_ruff_log" 2>/dev/null || true
          } > "$report"

          rm -f .github/workflows/pr27-validate-fixes-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f "$report"
          git diff --cached --check
          git commit -m "test: validate PR27 with standard prerequisites"
          git push origin HEAD:agent/pr1-wan22-language-prompt-plan
