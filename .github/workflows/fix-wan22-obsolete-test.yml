name: Fix Wan2.2 Obsolete Language Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-wan22-obsolete-test.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/integrate-wan22-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-wan22-main
          fetch-depth: 0
      - name: Remove superseded English-only assertion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/pipeline/test_ai_director_strategy.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          target = 'def test_default_system_prompts_require_english_for_sdxl'
          matches = [index for index, line in enumerate(lines) if target in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one obsolete test, found {len(matches)}')

          function_index = matches[0]
          start = function_index
          while start >= 0 and not lines[start].startswith('    @pytest.mark.parametrize'):
              start -= 1
          if start < 0:
              raise SystemExit('obsolete test decorator was not found')

          end = function_index + 1
          while end < len(lines) and not lines[end].startswith('    @pytest.mark.'):
              end += 1
          if end >= len(lines):
              raise SystemExit('next test decorator was not found')

          del lines[start:end]
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          git rm .github/workflows/fix-wan22-obsolete-test.yml
          git diff --check
          git add tests/unit/pipeline/test_ai_director_strategy.py
          git commit -m 'test: align prompt language assertions with model policy'
          git push origin HEAD:agent/integrate-wan22-main
