name: Fix test audit importorskip

on:
  push:
    branches:
      - fix/config-hardcode-migration
    paths:
      - .github/workflows/fix-test-audit-importorskip.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/config-hardcode-migration
          fetch-depth: 0

      - name: Remove forbidden optional-dependency skip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_hardcoded_value_migration.py")
          source = path.read_text(encoding="utf-8")
          target = '    pytest.importorskip("dotenv")\n'
          if source.count(target) != 1:
              raise SystemExit(
                  f"expected one forbidden importorskip, found {source.count(target)}"
              )
          path.write_text(source.replace(target, "", 1), encoding="utf-8")
          PY
          python scripts/audit_tests.py

      - name: Commit focused cleanup
        shell: bash
        run: |
          rm .github/workflows/fix-test-audit-importorskip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_hardcoded_value_migration.py \
            .github/workflows/fix-test-audit-importorskip.yml
          git commit -m "test(config): require dotenv in CORS bootstrap test"
          git push origin HEAD:fix/config-hardcode-migration
