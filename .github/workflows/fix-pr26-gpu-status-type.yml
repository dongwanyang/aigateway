name: Fix PR26 GPU Status Type

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-report-2026-08-02
          fetch-depth: 0
      - run: python scripts/fix_pr26_gpu_status_type.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-panel/src/api/_clientCore.ts
          git commit -m "fix(ui): type the normalized GPU execution contract"
          git push origin HEAD:agent/fix-qa-report-2026-08-02
