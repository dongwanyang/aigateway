name: Fix PR26 Recording Metrics Test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-report-2026-08-02
          fetch-depth: 0
      - run: python scripts/fix_pr26_recording_metrics_test.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_merge_readiness_followup.py
          git commit -m "test: define the stream metrics recorder"
          git push origin HEAD:agent/fix-qa-report-2026-08-02
