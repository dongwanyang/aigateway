name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local packages for audit
        # Install the local workspace packages so pip-audit can resolve
        # aigateway-api's dependency on aigateway-core (not on PyPI).
        run: |
          pip install -e aigateway-core
          pip install -e aigateway-api
          pip install -e aigateway-cli
      - name: Audit installed environment
        uses: pypa/gh-action-pip-audit@v1.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            control-panel/package-lock.json
            npm-installer/package-lock.json
      - name: Verify frontend lockfile and audit dependencies
        working-directory: control-panel
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Test and audit npm installer
        working-directory: npm-installer
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
