name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  apply-gpu-resource-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply deterministic GPU resource patch
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply_gpu_resource_observability.py
            python3 scripts/finalize_gpu_resource_patch.py
          } > /tmp/gpu-patch.log 2>&1
          status=$?
          cat /tmp/gpu-patch.log
          if [[ $status -ne 0 ]]; then
            cp /tmp/gpu-patch.log .gpu-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .gpu-patch-error.txt
            git commit -m 'chore: capture GPU patch failure'
            git push origin HEAD
            exit $status
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/docker-images.yml \
                  aigateway-api/src/aigateway_api/__init__.py \
                  aigateway-api/src/aigateway_api/gpu_routes.py \
                  aigateway-api/src/aigateway_api/main.py \
                  aigateway-core/src/aigateway_core/prefix/cache/l3_semantic.py \
                  config.yaml.template \
                  control-panel/src/api/client.ts \
                  control-panel/src/pages/Config.tsx \
                  control-panel/src/pages/Config.versioning.test.tsx \
                  control-panel/src/pages/GpuStatus.regression.test.tsx \
                  control-panel/src/pages/pages.integration.test.tsx \
                  scripts/quickstart.sh \
                  scripts/render-deployment-config.py \
                  tests/unit/test_gpu_resource_policy.py
          git commit -m 'fix(gpu): make resident memory observable and releasable'
          git push origin HEAD

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local packages for audit
        # Install the local workspace packages so pip-audit can resolve
        # aigateway-api's dependency on aigateway-core (not on PyPI).
        run: |
          pip install -e aigateway-core
          pip install -e aigateway-api
          pip install -e aigateway-cli
      - name: Audit installed environment
        uses: pypa/gh-action-pip-audit@v1.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            control-panel/package-lock.json
            npm-installer/package-lock.json
      - name: Verify frontend lockfile and audit dependencies
        working-directory: control-panel
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Test and audit npm installer
        working-directory: npm-installer
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
