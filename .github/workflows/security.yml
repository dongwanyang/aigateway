name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  apply-review-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-all-audit-findings'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply audited review fixes
        shell: bash
        run: |
          if [[ ! -f scripts/apply_review_blocker_fixes.py ]]; then
            echo "Patch driver already consumed"
            exit 0
          fi
          python scripts/apply_review_blocker_fixes.py
          rm scripts/apply_review_blocker_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix review blockers"
          git push origin HEAD:${{ github.head_ref }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local packages for audit
        # Install the local workspace packages so pip-audit can resolve
        # aigateway-api's dependency on aigateway-core (not on PyPI).
        run: |
          pip install -e aigateway-core
          pip install -e aigateway-api
          pip install -e aigateway-cli
      - name: Audit installed environment
        uses: pypa/gh-action-pip-audit@v1.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            control-panel/package-lock.json
            npm-installer/package-lock.json
      - name: Verify frontend lockfile and audit dependencies
        working-directory: control-panel
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Test and audit npm installer
        working-directory: npm-installer
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
