name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit API requirements
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: aigateway-api/requirements.txt
          # BasicSR is only imported for local RealESRGAN upscaling. The gateway
          # never invokes its SLURM launcher, which is the vulnerable path, and
          # upstream currently provides no fixed release.
          ignore-vulns: PYSEC-2026-1215
      - name: Audit core project
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: aigateway-core/
      - name: Audit CLI project
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: aigateway-cli/
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: control-panel/package-lock.json
      - name: Verify frontend lockfile and audit dependencies
        working-directory: control-panel
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
