name: Container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gateway-runtime
            suffix: lite
            platforms: linux/amd64,linux/arm64
          - target: gateway-rag-cpu
            suffix: knowledge
            platforms: linux/amd64,linux/arm64
          - target: gateway-rag
            suffix: knowledge-cuda
            platforms: linux/amd64
          - target: gateway-vision-cpu
            suffix: studio-arm64
            platforms: linux/arm64
          - target: gateway-vision
            suffix: studio-cuda
            platforms: linux/amd64
          - target: gateway-full-cpu
            suffix: full-arm64
            platforms: linux/arm64
          - target: gateway-full
            suffix: full-cuda
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aigateway-api/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigateway-gateway:${{ github.ref_name }}-${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/aigateway-gateway:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=gateway-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=gateway-${{ matrix.target }}

  comfyui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aigateway-api/Dockerfile
          target: comfyui
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigateway-comfyui:${{ github.ref_name }}-cuda
            ghcr.io/${{ github.repository_owner }}/aigateway-comfyui:latest-cuda
          cache-from: type=gha,scope=comfyui
          cache-to: type=gha,mode=max,scope=comfyui

  control-panel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: control-panel
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigateway-control-panel:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/aigateway-control-panel:latest
          cache-from: type=gha,scope=control-panel
          cache-to: type=gha,mode=max,scope=control-panel
