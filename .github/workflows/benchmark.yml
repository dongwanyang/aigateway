name: Benchmark Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'benchmarks/**'
      - 'aigateway-core/src/**'
      - 'aigateway-core/pyproject.toml'
      - 'aigateway-api/src/**'
      - 'aigateway-api/pyproject.toml'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      with_media:
        description: 'Include multimedia scenario (slow)'
        type: boolean
        default: false
      scenarios:
        description: 'Comma-separated scenario names (default: text_qa,long_conversation)'
        type: string
        default: 'text_qa,long_conversation'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis/redis-stack:7.2.0-v18
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
    env:
      AI_GATEWAY_ADMIN_KEY: ${{ secrets.AI_GATEWAY_ADMIN_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JUDGE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      AI_GATEWAY_REDIS_URL: redis://localhost:6379/0
      AI_GATEWAY_QDRANT_URL: http://localhost:6333
      AI_GATEWAY_ENV: test
      BENCHMARK_LIVE: ${{ secrets.OPENAI_API_KEY != '' || secrets.DEEPSEEK_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e aigateway-core
          pip install -e "aigateway-api[rag]"
          pip install -e aigateway-cli

      - name: Start gateway
        if: env.BENCHMARK_LIVE == 'true'
        run: |
          uvicorn aigateway_api.main:create_app --factory --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl --fail --show-error http://localhost:8000/health

      - name: Run benchmark (text only)
        if: env.BENCHMARK_LIVE == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.with_media))
        env:
          SCENARIOS: ${{ inputs.scenarios || 'text_qa,long_conversation' }}
        run: |
          IFS=',' read -ra scenario_args <<< "$SCENARIOS"
          python benchmarks/benchmark.py \
            --scenarios "${scenario_args[@]}" \
            --judge \
            --concurrency 1

      - name: Run benchmark (with media)
        if: env.BENCHMARK_LIVE == 'true' && github.event_name == 'workflow_dispatch' && inputs.with_media
        env:
          SCENARIOS: ${{ inputs.scenarios || 'text_qa,long_conversation' }}
        run: |
          IFS=',' read -ra scenario_args <<< "$SCENARIOS"
          python benchmarks/benchmark.py \
            --scenarios "${scenario_args[@]}" \
            --with-media \
            --judge \
            --concurrency 1

      - name: Validate benchmark scenarios without provider secrets
        if: env.BENCHMARK_LIVE != 'true'
        env:
          SCENARIOS: ${{ inputs.scenarios || 'text_qa,long_conversation' }}
        run: |
          echo "::notice::Provider API secrets are unavailable; validating benchmark datasets without live model calls."
          IFS=',' read -ra scenario_args <<< "$SCENARIOS"
          python benchmarks/benchmark.py \
            --scenarios "${scenario_args[@]}" \
            --dry-run \
            --concurrency 1

      - name: Check drift against expected results
        if: env.BENCHMARK_LIVE == 'true'
        run: |
          report="benchmarks/reports/report-$(date -u +%Y-%m-%d).md"
          test -f "$report"
          python benchmarks/compare_to_expected.py --current "$report"

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        if: always() && env.BENCHMARK_LIVE == 'true'
        with:
          name: benchmark-report
          path: benchmarks/reports/report-*.md
