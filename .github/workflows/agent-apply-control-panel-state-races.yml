name: Agent Apply Control Panel State Races

on:
  push:
    branches:
      - agent/fix-control-panel-state-races

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_control_panel_state_races.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-panel/src/contexts/AuthContext.tsx \
                  control-panel/src/contexts/AuthContext.integration.test.tsx \
                  control-panel/src/pages/Cache.tsx \
                  control-panel/src/pages/Logs.tsx \
                  control-panel/src/pages/Overview.tsx \
                  control-panel/src/pages/StateRace.regression.test.tsx \
                  control-panel/src/api/client.ts
          git commit -m 'fix(ui): isolate session state and async results'
          git push origin HEAD
