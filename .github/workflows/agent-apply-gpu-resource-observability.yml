name: Agent Apply GPU Resource Observability

on:
  push:
    branches:
      - agent/fix-gpu-resource-observability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply deterministic patch
        id: patch
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply_gpu_resource_observability.py
            python3 scripts/finalize_gpu_resource_patch.py
          } > /tmp/gpu-patch.log 2>&1
          status=$?
          cat /tmp/gpu-patch.log
          if [[ $status -ne 0 ]]; then
            cp /tmp/gpu-patch.log .gpu-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .gpu-patch-error.txt
            git commit -m 'chore: capture GPU patch failure'
            git push origin HEAD
            exit $status
          fi
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/docker-images.yml \
                  aigateway-api/src/aigateway_api/__init__.py \
                  aigateway-api/src/aigateway_api/gpu_routes.py \
                  aigateway-api/src/aigateway_api/main.py \
                  aigateway-core/src/aigateway_core/prefix/cache/l3_semantic.py \
                  config.yaml.template \
                  control-panel/src/api/client.ts \
                  control-panel/src/pages/Config.tsx \
                  control-panel/src/pages/Config.versioning.test.tsx \
                  control-panel/src/pages/GpuStatus.regression.test.tsx \
                  control-panel/src/pages/pages.integration.test.tsx \
                  scripts/quickstart.sh \
                  scripts/render-deployment-config.py \
                  tests/unit/test_gpu_resource_policy.py
          git commit -m 'fix(gpu): make resident memory observable and releasable'
          git push origin HEAD

# This workflow is temporary and removed after the deterministic patch is applied.
