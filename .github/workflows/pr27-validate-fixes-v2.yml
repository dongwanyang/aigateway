name: Validate PR27 fixes v2

on:
  push:
    branches:
      - agent/pr1-wan22-language-prompt-plan
    paths:
      - .github/workflows/pr27-validate-fixes-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr1-wan22-language-prompt-plan
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aigateway-core/pyproject.toml
            aigateway-api/pyproject.toml
            aigateway-cli/pyproject.toml

      - name: Run validation and publish report
        shell: bash
        run: |
          set +e
          report=pr27-validation-report.txt
          install_log=/tmp/pr27-install.log
          focused_log=/tmp/pr27-focused.log
          unit_log=/tmp/pr27-unit.log
          ruff_log=/tmp/pr27-ruff.log
          : > "$report"

          echo "PR27 validation started at $(date -u +%FT%TZ)" >> "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"

          python -m pip install --upgrade pip > "$install_log" 2>&1
          python -m pip install -e aigateway-core >> "$install_log" 2>&1
          install_core=$?
          python -m pip install -e "aigateway-api[dev]" >> "$install_log" 2>&1
          install_api=$?
          python -m pip install -e aigateway-cli >> "$install_log" 2>&1
          install_cli=$?

          focused=99
          full_unit=99
          ruff_status=99
          if [ "$install_core" -eq 0 ] && [ "$install_api" -eq 0 ] && [ "$install_cli" -eq 0 ]; then
            python -m pytest \
              tests/unit/pipeline/test_ai_director_video_plan.py \
              tests/unit/pipeline/test_video_generation_models.py \
              tests/unit/pipeline/test_ai_director_video_plugin.py \
              tests/unit/pipeline/test_draft_video_plan_wiring.py \
              tests/unit/pipeline/test_ai_director_strategy.py \
              tests/unit/pipeline/test_ai_director_plugin.py \
              tests/unit/pipeline/test_draft_generator_strategy.py \
              tests/unit/api/test_local_generation.py \
              tests/unit/api/test_local_generation_video_languages.py \
              -q > "$focused_log" 2>&1
            focused=$?

            python -m pytest tests/unit/ -q > "$unit_log" 2>&1
            full_unit=$?

            python -m ruff check \
              aigateway-core/src \
              aigateway-api/src \
              aigateway-cli/src \
              tests > "$ruff_log" 2>&1
            ruff_status=$?
          fi

          overall=0
          for code in "$install_core" "$install_api" "$install_cli" "$focused" "$full_unit" "$ruff_status"; do
            if [ "$code" -ne 0 ]; then overall=1; fi
          done

          {
            echo "INSTALL_CORE=$install_core"
            echo "INSTALL_API=$install_api"
            echo "INSTALL_CLI=$install_cli"
            echo "FOCUSED_TESTS=$focused"
            echo "FULL_UNIT_TESTS=$full_unit"
            echo "RUFF=$ruff_status"
            echo "OVERALL_STATUS=$overall"
            echo "PR27 validation finished at $(date -u +%FT%TZ)"
            echo
            echo "=== INSTALL LOG (tail 120) ==="
            tail -n 120 "$install_log" 2>/dev/null || true
            echo
            echo "=== FOCUSED TEST LOG (tail 400) ==="
            tail -n 400 "$focused_log" 2>/dev/null || true
            echo
            echo "=== FULL UNIT LOG (tail 400) ==="
            tail -n 400 "$unit_log" 2>/dev/null || true
            echo
            echo "=== RUFF LOG (tail 400) ==="
            tail -n 400 "$ruff_log" 2>/dev/null || true
          } >> "$report"

          rm -f .github/workflows/pr27-validate-fixes-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f "$report"
          git diff --cached --check
          git commit -m "test: record PR27 validation results v2"
          git push origin HEAD:agent/pr1-wan22-language-prompt-plan
