name: Resolve PR47 conflicts preferring PR47

on:
  push:
    branches:
      - fix/chat-video-display-and-logging

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR47 branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-video-display-and-logging
          fetch-depth: 0

      - name: Merge main and keep PR47 for conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Merge all non-conflicting changes from main. For textual conflicts,
          # prefer the current branch (PR47).
          git merge --no-commit --no-ff -X ours origin/main || true

          # Resolve any remaining modify/delete, rename, or binary conflicts by
          # taking PR47's exact file state. If PR47 deleted the path, keep it deleted.
          while IFS= read -r -d '' path; do
            if git cat-file -e "HEAD:${path}" 2>/dev/null; then
              git checkout HEAD -- "$path"
              git add -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done < <(git diff --name-only --diff-filter=U -z)

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git commit -m "merge: resolve main into PR47 preferring PR47"

          # Remove this one-shot workflow so it does not remain in the product tree.
          git rm .github/workflows/tmp-resolve-pr47-conflicts.yml
          git commit -m "ci: remove temporary PR47 conflict resolver"
          git push origin HEAD:fix/chat-video-display-and-logging
