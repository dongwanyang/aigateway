name: Apply PR26 Config UI Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 26 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-report-2026-08-02
          fetch-depth: 0
      - name: Apply source transformation
        run: python scripts/apply_pr26_config_gpu_ui.py
      - name: Commit transformed source
        run: |
          if git diff --quiet -- control-panel/src/pages/Config.tsx; then
            echo "Config.tsx already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-panel/src/pages/Config.tsx
          git commit -m "fix(ui): align GPU status with execution contract"
          git push origin HEAD:agent/fix-qa-report-2026-08-02
