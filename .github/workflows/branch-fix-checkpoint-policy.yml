name: Branch Fix Checkpoint Policy

on:
  push:
    branches:
      - feat/gpu-scheduler-topology
    paths:
      - .github/workflows/branch-fix-checkpoint-policy.yml
      - .github/scripts/checkpoint-fix.part*

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpu-scheduler-topology
          fetch-depth: 0

      - name: Apply fixes and run targeted regressions
        shell: bash
        run: |
          set +e
          cat .github/scripts/checkpoint-fix.part* | base64 -d | gzip -d > /tmp/apply_checkpoint_policy_fixes.py
          python /tmp/apply_checkpoint_policy_fixes.py > /tmp/checkpoint-fix.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python -m compileall -q aigateway-core/src aigateway-api/src tests/unit >> /tmp/checkpoint-fix.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            pip install -e aigateway-core >> /tmp/checkpoint-fix.log 2>&1
            pip install -e aigateway-api >> /tmp/checkpoint-fix.log 2>&1
            pip install pytest pytest-asyncio pyyaml >> /tmp/checkpoint-fix.log 2>&1
            python -m pytest \
              tests/unit/api/test_local_generation.py \
              tests/unit/pipeline/test_qwen_image_selection_policy.py \
              tests/unit/cli/test_coverage_workflow.py \
              -q >> /tmp/checkpoint-fix.log 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/checkpoint-fix.log .github/checkpoint-fix-failure.log
            git add .github/checkpoint-fix-failure.log
            git commit -m "chore: record checkpoint fix failure"
            git push origin HEAD:feat/gpu-scheduler-topology
            exit 0
          fi

          rm -f .github/checkpoint-fix-failure.log
          rm -f .github/scripts/apply_checkpoint_policy_fixes.py.gz.b64
          rm -f .github/scripts/checkpoint-fix.part*
          rm -f .github/workflows/branch-fix-checkpoint-policy.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(generation): enforce trusted checkpoint selection"
          git push origin HEAD:feat/gpu-scheduler-topology
