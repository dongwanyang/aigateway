name: Branch Fix Checkpoint Policy

on:
  push:
    branches:
      - feat/gpu-scheduler-topology
    paths:
      - .github/workflows/branch-fix-checkpoint-policy.yml
      - .github/scripts/apply_checkpoint_policy_fixes.py.gz.b64

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpu-scheduler-topology
          fetch-depth: 0

      - name: Apply fixes
        run: |
          base64 -d .github/scripts/apply_checkpoint_policy_fixes.py.gz.b64 | gzip -d > /tmp/apply_checkpoint_policy_fixes.py
          python /tmp/apply_checkpoint_policy_fixes.py
          python -m compileall -q aigateway-core/src aigateway-api/src tests/unit

      - name: Install targeted test dependencies
        run: |
          pip install -e aigateway-core
          pip install -e aigateway-api
          pip install pytest pytest-asyncio pyyaml

      - name: Run targeted regressions
        run: |
          python -m pytest \
            tests/unit/api/test_local_generation.py \
            tests/unit/pipeline/test_qwen_image_selection_policy.py \
            tests/unit/cli/test_coverage_workflow.py \
            -q

      - name: Remove temporary automation files
        run: |
          rm -f .github/scripts/apply_checkpoint_policy_fixes.py.gz.b64
          rm -f .github/workflows/branch-fix-checkpoint-policy.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(generation): enforce trusted checkpoint selection"
          git push origin HEAD:feat/gpu-scheduler-topology
