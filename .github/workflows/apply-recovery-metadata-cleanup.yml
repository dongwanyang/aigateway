name: Apply recovery metadata cleanup

on:
  push:
    branches:
      - agent/fix-qa-review-findings
    paths:
      - scripts/apply_recovery_metadata_cleanup.py
      - .github/workflows/apply-recovery-metadata-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-qa-review-findings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_recovery_metadata_cleanup.py
      - run: rm -f scripts/apply_recovery_metadata_cleanup.py .github/workflows/apply-recovery-metadata-cleanup.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: clear recovered draft retry metadata"
          git push origin HEAD:agent/fix-qa-review-findings
