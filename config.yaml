server:
  host: 0.0.0.0
  port: 8000
  request_timeout_seconds: 120
  cors_origins:
  - http://localhost:3000
  - http://localhost:5173
plugin_runtime:
  default_timeout_seconds: 30
  default_failure_policy: continue
  plugins:
    draft_generator:
      timeout_seconds: 110
retry_budget:
  max_attempts: 3
  max_time_seconds: 30
  max_fallback: 1
intent_classifier:
  model: agnes-2.0-flash
  timeout_seconds: 2
  fallback: heuristic
  fast_path_enabled: true
  fast_path_confidence: 0.8
  cache_ttl_seconds: 300
  cache_max_entries: 1024
model_selector:
  health_check_interval: 60
  latency_weight: 0.4
  cost_weight: 0.2
  success_rate_weight: 0.4
task_routing:
  enabled: true
  version: '2'
  min_confidence: 0.6
  model_selection_mode: policy
  expose_debug_metadata: false
  model_preferences:
    coding:
    - kimi-k2.7-code
    - deepseek-v4-pro
    reasoning:
    - deepseek-v4-pro
    - glm-5.2
    summary:
    - agnes-2.0-flash
    vision:
    - agnes-2.0-flash
    general:
    - agnes-2.0-flash
generation:
  image:
    default_size: 2K
    response_format: url
    quality: auto
  video:
    poll_endpoint: /v1/videos/{id}
auth:
  database_path: /app/data/auth.db
  database_timeout_seconds: 30
  admin_username: admin
  admin_user_id: admin
  session:
    idle_ttl_seconds: 28800
    absolute_ttl_seconds: 86400
  password:
    pbkdf2_iterations: 600000
  api_keys:
  - key: ${ADMIN_API_KEY:-}
    user_id: admin
    scopes:
    - admin
    - chat
    - embedding
    expires_at: null
    group: admin-team
    quotas:
      daily_tokens: 10000000
      monthly_cost: 5000
      rate_limit_rpm: 600
      rate_limit_tpm: 10000000000
  distributed_mode: false
  defaults:
    daily_tokens: 1000000
    monthly_cost: 50
    rate_limit_rpm: 60
    rate_limit_tpm: 100000
  budget_alert_threshold: 0.8
  groups:
  - name: admin-team
    daily_tokens: 10000000
    monthly_cost: 5000
    rate_limit_rpm: 600
    rate_limit_tpm: 10000000000
plugins:
- name: pii_detector
  enabled: true
  depends_on: []
  config:
    strategy: sanitize
- name: prompt_cache
  enabled: true
  depends_on: []
  config: {}
- name: semantic_cache
  enabled: true
  depends_on:
  - prompt_cache
  config:
    embedding_model: Qwen/Qwen3-Embedding-0.6B
    threshold: 0.95
    ttl: 86400
    rerank:
      enabled: false
      backend: lightweight
      retrieve_top_k: 5
      retrieve_threshold: 0.9
      rerank_threshold: 0.85
- name: prompt_compress
  enabled: true
  depends_on:
  - semantic_cache
  config:
    compression_ratio: 0.5
    model_name: microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank
    target_token: -1
    device: cpu
- name: rag_retriever
  enabled: true
  depends_on:
  - semantic_cache
  config:
    top_k: 5
    similarity_threshold: 0.7
    rerank_enabled: false
    chunk_size: 512
    chunk_overlap: 64
    collection_name: rag_documents
    embedding_backend: local
    embedding_model: Qwen/Qwen3-Embedding-0.6B
    embedding_device: auto
    code_rag_enabled: true
    code_rag_graph_hops: 2
    code_rag_top_k: 5
- name: conv_compressor
  enabled: true
  depends_on:
  - semantic_cache
  config:
    max_history: 20
    summary_model: agnes-2.0-flash
    max_token_limit: 4000
    summary_interval: 5
    api_base: http://localhost:8000/v1
    api_key: ${CONV_COMPRESSOR_API_KEY:-}
providers:
  agnes:
    api_key: ${AGNES_API_KEY:-}
    base_url: https://apihub.agnes-ai.com/v1
    model_grouper:
    - models:
      - name: agnes-2.0-flash
        capabilities:
        - text
        - image
        - video
        tasks:
        - general
        - summary
        - vision
        features:
        - vision
        - tool_calling
        - structured_output
        - long_context
      - name: agnes-image-2.1-flash
        capabilities:
        - image
      - name: agnes-video-v2.0
        capabilities:
        - video
      fallback_models: []
      pricing:
        agnes-2.0-flash:
          prompt: 0.00000002
          completion: 0.000001
        agnes-image-2.1-flash:
          prompt: 0
          completion: 0
        agnes-video-v2.0:
          prompt: 0
          completion: 0
    num_retries: 3
    retry_after: 1000
    timeout: 3600
  deepseek:
    api_key: ${DEEPSEEK_API_KEY:-}
    base_url: https://api.deepseek.com/v1
    timeout: 120
    num_retries: 3
    retry_after: 1000
    model_grouper:
    - models:
      - name: deepseek-v4-flash
        capabilities:
        - text
        tasks:
        - coding
        - reasoning
        - general
        features:
        - tool_calling
        - structured_output
        - long_context
      - name: deepseek-v4-pro
        capabilities:
        - text
        tasks:
        - coding
        - reasoning
        - general
        features:
        - tool_calling
        - structured_output
        - long_context
      fallback_models: []
      pricing:
        deepseek-v4-flash:
          prompt: 0.00000002
          completion: 0.000001
        deepseek-v4-pro:
          prompt: 0.00000002
          completion: 0.000001
  glm5.2:
    api_key: ${GLM52_API_KEY:-}
    base_url: https://buddy.relaypool.cam/codebuddy/v1
    model_grouper:
    - models:
      - name: glm-5.2
        capabilities:
        - text
        tasks:
        - general
        - reasoning
        features:
        - tool_calling
        - structured_output
        - long_context
      - name: deepseek-v4-pro
        capabilities:
        - text
        tasks:
        - reasoning
        - coding
        features:
        - tool_calling
        - structured_output
        - long_context
      - name: kimi-k2.7-code
        capabilities:
        - text
        tasks:
        - coding
        features:
        - tool_calling
        - structured_output
        - long_context
      fallback_models: []
      pricing:
        glm-5.2:
          prompt: 0
          completion: 0
        deepseek-v4-pro:
          prompt: 0
          completion: 0
        kimi-k2.7-code:
          prompt: 0
          completion: 0
    num_retries: 3
    retry_after: 1000
    timeout: 120
embedding:
  backend: sentence_transformers
  model: Qwen/Qwen3-Embedding-0.6B
  vector_dim: 1024
  openai_model: text-embedding-3-small
  device: auto
observability:
  prometheus_enabled: true
  opentelemetry_enabled: true
  otel_service_name: ai-gateway
  otel_sample_rate: 0.1
  log_format: json
  log_level: info
infrastructure:
  redis:
    url: ${AI_GATEWAY_REDIS_URL:-redis://localhost:6379/0}
    namespace: ai-gateway
    connect_timeout: 5
    socket_timeout: 10
    health_check_interval: 30
    rpm_key_ttl: 120
    tpm_window_ttl: 60
  qdrant:
    url: ${AI_GATEWAY_QDRANT_URL:-http://localhost:6333}
    connect_timeout: 5
    read_timeout: 10
    write_timeout: 10
    distance: COSINE
    hnsw_m: 16
    hnsw_ef_construct: 128
cache:
  pipeline_version: '2'
  key_buckets:
    max_tokens:
    - 256
    - 512
    - 1024
    - 2048
    - 4096
    - 8192
    - 16384
  l1:
    max_entries: 1000
    max_value_bytes: 102400
  l2:
    max_value_bytes: 512000
    default_ttl: 3600
    bm25:
      enabled: true
      min_score: 1.5
      top_k: 5
  l3:
    min_token_count: 100
    default_ttl: 86400
    cleanup_interval: 3600
    similarity_threshold: 0.95
    rerank:
      enabled: false
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      retrieve_top_k: 5
      retrieve_threshold: 0.9
      rerank_threshold: 0.85
circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 60
  long_open_alert_seconds: 300
rate_limiter:
  max_requests: 10000
  window_seconds: 60
streaming:
  cache_chunk_delay_ms: 20
  cache_chunk_count: 20
code_rag:
  enabled: true
  allowed_server_paths:
  - /home/ubuntu
  - /workspace
  max_file_size_mb: 5
  max_total_size_mb: 200
  max_file_count: 5000
  ignore_patterns:
  - node_modules
  - .git
  - __pycache__
  - dist
  - build
  - .venv
  - vendor
  - .github
  - .gitlab
  - .circleci
  - .vscode
  - .idea
  - .env
  - .env.*
  - coverage
  - htmlcov
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - .tox
  - .eggs
  - '*.egg-info'
  - '*.lock'
  - '*.log'
  - '*.DS_Store'
  - docs
  - tests
  - test
  - __tests__
  - spec
  - cypress
  - playwright
  - storybook
  - node_modules
  graph_db_dir: /data/code_graphs
hot_reload: true
debug:
  frontend: false
  entry: false
  cache: false
  bridge: false
  plugins_enabled: false
  plugins:
    enabled: false
media_optimization:
  enabled: true
  download_timeouts:
    image: 30
    video: 120
    audio: 60
    document: 60
  image:
    max_width: 1920
    max_height: 1080
    quality: 85
    output_format: webp
    ocr_backend: tesseract
    ocr_languages:
    - eng
    - chi_sim
    caption_model: agnes-image-2.1-flash
    max_file_size_mb: 20
    caption_max_tokens: 150
    caption_temperature: 0.3
    paddleocr:
      lang: ch
      use_angle_cls: true
  video:
    max_frames: 10
    frame_interval_sec: 5
    scene_detection: true
    target_resolution: 720p
    max_duration_sec: 300
    whisper_model: faster-whisper
    language: auto
    max_file_size_mb: 100
  audio:
    target_format: opus
    sample_rate: 16000
    bitrate: 64k
    whisper_model: faster-whisper
    language: auto
    max_duration_sec: 600
    diarization_enabled: false
    max_file_size_mb: 50
    whisper_model_size: base
  document:
    supported_formats:
    - pdf
    - docx
    - xlsx
    - pptx
    - md
    - csv
    - html
    ocr_fallback: true
    chunk_size: 512
    chunk_overlap: 64
    chunking_strategy: semantic
    embedding_model: Qwen/Qwen3-Embedding-0.6B
    vector_dim: 1024
    summary_max_length: 500
    max_file_size_mb: 50
    long_doc_threshold_chars: 5000
    summary_preview_chars: 2000
    unstructured:
      strategy: auto
      languages:
      - chi_sim
      - eng
      extract_images: false
  generation:
    enhancement_level: 'off'
    vision_model: gpt-4o
    default_model: gpt-4o
    max_retries: 3
    retry_delay_ms: 1000
  media_cache_ttl: 604800
  max_concurrent_processors: 4
gpu_scheduler:
  enabled: true
  policy: auto
  generation_priority: true
  gateway_devices: auto
  comfyui_devices: auto
  gateway_fallback: cpu
  generation_wait_timeout_seconds: 600
  comfyui_idle_reservation_seconds: 60
  lease_ttl_seconds: 15
  lease_heartbeat_seconds: 5
  worker_probe_interval_seconds: 10
  worker_unhealthy_cooldown_seconds: 30
  oom_quarantine_seconds: 300
  max_worker_failover_attempts: 1
  device_safety_margin_gb: 2
  gateway_memory_limit_percent: null
  device_overrides: []
  topology_auto_apply: false
  topology_reconcile_interval_seconds: 10
generation_optimization:
  enabled: true
  preset_store_dir: /app/data/generation-presets
  ai_director:
    enabled: true
    timeout_seconds: 30
  model_router:
    model_capabilities:
      agnes-2.0-flash: 60
      agnes-image-2.1-flash: 80
      agnes-video-v2.0: 85
      glm-5.2: 75
      deepseek-v4-flash: 65
      deepseek-v4-pro: 90
      kimi-k2.7-code: 85
    enabled: true
  feature_cache: {}
  cost_tracking:
    enabled: true
  prompt_templates: {}
  token_compressor:
    clip:
      model_name: openai/clip-vit-large-patch14
      device: cpu
      batch_size: 1
    enabled: true
  draft_workflow:
    store_dir: /app/data/drafts
    retention_period_hours: 24
    comfyui:
      server_url: http://comfyui:8188
      public_url: http://localhost:8188
      manager_enabled: true
      connect_timeout: 10
      execution_timeout: 1200
      progress_stall_timeout: 300
      required: true
      scheduler_managed: true
      workflow_version: image-v1
      checkpoint_name: sd_xl_base_1.0.safetensors
      allowed_checkpoints:
      - sd_xl_base_1.0.safetensors
      # Discovered checkpoints are selectable only when allowlisted above and
      # assigned a server-side minimum VRAM budget here.
      checkpoint_vram_gb:
        sd_xl_base_1.0.safetensors: 8
      max_concurrency: 1
      min_free_gb: 30
      model_budget_gb: 80
      output_budget_gb: 10
      output_retention_hours: 24
      models_path: /comfyui/models
      output_path: /comfyui/output
      workflow_path: /comfyui/workflows
      upscale_enabled: true
      upscale_model: RealESRGAN_x4plus.pth
      allowed_upscale_models:
      - RealESRGAN_x4plus.pth
      max_upscale_long_edge: 4096
      sdxl_required_vram_gb: 8
      upscale_required_vram_gb: 4
      qwen_image_enabled: true
      qwen_image_diffusion_model: qwen_image_fp8_e4m3fn.safetensors
      qwen_image_text_encoder: qwen_2.5_vl_7b_fp8_scaled.safetensors
      qwen_image_vae: qwen_image_vae.safetensors
      qwen_image_draft_steps: 12
      qwen_image_max_draft_edge: 768
      qwen_image_required_vram_gb: 12
      allowed_qwen_image_diffusion_models:
      - qwen_image_fp8_e4m3fn.safetensors
      allowed_qwen_image_text_encoders:
      - qwen_2.5_vl_7b_fp8_scaled.safetensors
      allowed_qwen_image_vaes:
      - qwen_image_vae.safetensors
      video_enabled: true
      video_workflow_version: wan2.2-ti2v-5b-v1
      video_diffusion_model: wan2.2_ti2v_5B_fp16.safetensors
      video_text_encoder: umt5_xxl_fp8_e4m3fn_scaled.safetensors
      video_vae: wan2.2_vae.safetensors
      allowed_video_diffusion_models:
      - wan2.2_ti2v_5B_fp16.safetensors
      allowed_video_text_encoders:
      - umt5_xxl_fp8_e4m3fn_scaled.safetensors
      allowed_video_vaes:
      - wan2.2_vae.safetensors
      video_width: 512
      video_height: 288
      video_frames: 17
      video_fps: 8
      video_steps: 20
      video_cfg: 5
      video_shift: 8
      video_execution_timeout: 1200
      video_required_vram_gb: 12
    enabled: true
debug_mode: false
