services:
  control-panel:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_PATH:?TLS_CERT_PATH must point to a PEM certificate}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH must point to the certificate private key}:/etc/nginx/tls/tls.key:ro
    command:
      - /bin/sh
      - -c
      - cp /opt/aigateway/nginx.prod.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
