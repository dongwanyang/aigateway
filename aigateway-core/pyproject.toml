[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigateway-core"
version = "0.1.1.0"
description = "AI Gateway core library — pipeline engine, plugins, media processing, and configuration management."
# 上界 <3.14：paddleocr → paddlepaddle 目前（3.3.1）未发布 cp313/cp314 wheel，
# llama-index-vector-stores-qdrant >=0.2 同样锁 <3.14。放开上界会让 all-integrations 无法安装。
requires-python = ">=3.12,<3.14"
license = "MIT"

dependencies = [
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.24.0",
    "redis>=5.0.0",
    "structlog>=23.1.0",
    "lz4>=4.0.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
rag = [
    "llmlingua>=0.2.0",
    "transformers>=4.51.0",
    "sentence-transformers>=3.0.0",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "qdrant-client>=1.9.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-classic>=1.0.0",
    "langchain-openai>=0.3.0",
    "gitpython>=3.1.0",
]
vision = [
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0",
    "faster-whisper>=1.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "transformers>=4.51.0",
    "realesrgan>=0.3.0",
    "basicsr>=1.4.2",
]
gpu = ["torch>=2.0.0"]
all-integrations = [
    "aigateway-core[rag,vision,gpu]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway_core"]
