[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigateway-api"
version = "0.1.1.0"
description = "AI Gateway API server — FastAPI application with auth, routing, and admin endpoints."
requires-python = ">=3.12,<3.14"
license = "MIT"

dependencies = [
    "aigateway-core>=0.1.1.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.5.0",
    "litellm>=1.30.0",
    "httpx>=0.24.0",
    "hiredis>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
rag = ["aigateway-core[rag]>=0.1.1.0"]
vision = ["aigateway-core[vision]>=0.1.1.0"]
gpu = ["aigateway-core[gpu]>=0.1.1.0"]
all = ["aigateway-core[rag,vision,gpu]>=0.1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway_api"]

[tool.coverage.run]
source = ["aigateway_api", "aigateway_core"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/aigateway_api/main.py",
    "*/aigateway_cli/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .-__main__.",
    "def __repr__",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true
fail_under = 50
precision = 2
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
